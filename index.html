    if(k==='smokeball'){this.block+=10;this.fxText(this.playerEl(),'+10','blk')}
    if(k==='bakukunai'){
      for(const e of this.enemies.filter(e=>e.hp>0)){
        this.dealDamage(e,9);
        if(this.hp<=0){this.updateTopbar();return this.gameOver()}
      }
      if(this.checkWin())return;
    }
    if(k==='chakrapill')this.energy+=2;
    if(k==='antidote'){this.poison=0;this.weak=0;this.vuln=0}
    if(k==='strpill')this.str+=1;
    if(k==='clonepill')this.clones+=2;
    if(k==='foxpill'){this.str+=1;this.addRamp(1,3)}
    if(k==='toadoil'){this.dex+=1;this.clones+=2}
    if(k==='sealpaper')this.enemies.filter(e=>e.hp>0).forEach(e=>{e.weak+=2;e.vuln+=2});
    if(k==='dexpill')this.dex+=2;
    if(k==='lightningpill'){this.energy+=1;this.enemies.filter(e=>e.hp>0).forEach(e=>e.vuln+=1)}
    if(k==='eyedrops')this.enemies.filter(e=>e.hp>0).forEach(e=>{e.weak+=1;e.vuln+=1});
    if(k==='fireseal'){
      for(const e of this.enemies.filter(e=>e.hp>0)){
        this.dealDamage(e,14);
        if(this.hp<=0){this.updateTopbar();return this.gameOver()}
      }
      if(this.checkWin())return;
    }
    if(k==='medspray'){this.heal(10);this.poison=0;this.weak=0;this.vuln=0}
    if(k==='mightpill'){this.str+=1;this.block+=6;this.fxText(this.playerEl(),'+6','blk')}
    if(k==='slugfluid'){this.heal(6);this.block+=10;this.fxText(this.playerEl(),'+10','blk')}
    this.updateTopbar();this.renderCombat();
  },

  /* ---------- StS式路线图 ---------- */
  genMap(attempt=0){
    const C=MAP_RULES,ROWS=C.rows,COLS=C.cols,PATHS=C.paths;
    const nodes={};   // "r-c" -> {r,c,t,edges:Set}
    const key=(r,c)=>r+'-'+c;
    for(let p=0;p<PATHS;p++){
      let c=rnd(0,COLS-1);
      let prev=null;
      for(let r=1;r<=ROWS;r++){
        if(r>1)c=Math.max(0,Math.min(COLS-1,c+rnd(-1,1)));
        const k=key(r,c);
        if(!nodes[k])nodes[k]={r,c,t:null,edges:new Set(),from:new Set()};
        if(prev&&prev!==k){nodes[prev].edges.add(k);nodes[k].from.add(prev)}
        prev=k;
      }
      nodes[prev].edges.add('boss');
    }
    nodes['boss']={r:ROWS+1,c:(COLS-1)/2,t:'boss',edges:new Set(),from:new Set()};
    const starts=Object.keys(nodes).filter(k=>nodes[k].r===1);
    const routes=[];
    const walk=(k,path=[])=>{
      if(routes.length>=1500)return;
      const p=path.concat(k);
      if(k==='boss'){routes.push(p);return}
      nodes[k].edges.forEach(nk=>walk(nk,p));
    };
    starts.forEach(k=>walk(k));
    const chestRow=rnd(4,ROWS-2);
    let restRow=rnd(C.guaranteedRestFrom,Math.min(C.guaranteedRestTo,ROWS-1));
    while(restRow===chestRow)restRow=rnd(C.guaranteedRestFrom,Math.min(C.guaranteedRestTo,ROWS-1));
    const routeCount=(route,t)=>route.filter(k=>nodes[k]&&nodes[k].t===t).length;
    const routesWith=k=>routes.filter(r=>r.includes(k));
    const hasIncomingType=(n,t)=>[...n.from].some(k=>nodes[k]&&nodes[k].t===t);
    const hasNeighborType=(n,t)=>hasIncomingType(n,t)||[...n.edges].some(k=>nodes[k]&&nodes[k].t===t);
    const weightedType=(includeElite=true)=>{
      const entries=Object.entries(C.weights).filter(([t])=>includeElite||t!=='elite');
      const sum=entries.reduce((s,[,w])=>s+w,0);
      let r=Math.random()*sum;
      for(const [t,w] of entries){r-=w;if(r<=0)return t}
      return 'fight';
    };
    const canUse=(k,t)=>{
      const n=nodes[k];
      if(t==='elite'&&n.r<=C.noEliteBefore)return false;
      if(t==='rest'&&(n.r===chestRow||n.r===restRow-1||n.r===restRow+1))return false;
      if(t==='rest'&&hasIncomingType(n,'rest'))return false;
      if(t==='elite'){
        if(hasNeighborType(n,'elite'))return false;
        const rowNodes=Object.values(nodes).filter(x=>x.r===n.r);
        if(rowNodes.length>1&&rowNodes.every(x=>x===n||x.t==='elite'))return false;
        if(routesWith(k).some(r=>routeCount(r,'elite')>=C.maxElitePerRoute))return false;
      }
      if(t==='unknown'&&routesWith(k).some(r=>routeCount(r,'unknown')>=C.maxUnknownPerRoute))return false;
      return true;
    };
    for(let r=1;r<=ROWS;r++){
      const row=Object.entries(nodes).filter(([,n])=>n.r===r);
      row.forEach(([k,n])=>{
        if(r===1){n.t='fight';return}
        if(r===chestRow){n.t='chest';return}
        if(r===restRow){n.t='rest';return}
        const first=weightedType(false);
        const choices=[first,'fight','unknown','shop','rest'];
        n.t=choices.find(t=>canUse(k,t))||'fight';
      });
      if(r!==chestRow&&r!==restRow&&!row.some(([,n])=>n.t==='fight'||n.t==='elite')){
        const f=row.find(([k])=>canUse(k,'fight'));
        if(f)f[1].t='fight';
      }
    }
    if(!Object.values(nodes).some(n=>n.t==='rest')){
      const restSpot=shuffle(Object.entries(nodes).filter(([k,n])=>k!=='boss'&&n.r>2&&n.r!==chestRow&&!hasNeighborType(n,'rest')))[0];
      if(restSpot)restSpot[1].t='rest';
    }
    const minElites=C.minElitePerRoute||0;
    let guard=0;
    while(guard++<Object.keys(nodes).length*3){
      const deficient=routes.filter(route=>routeCount(route,'elite')<minElites);
      if(!deficient.length)break;
      const candidates=shuffle(Object.keys(nodes).filter(k=>{
        const n=nodes[k];
        return k!=='boss'&&n.r<ROWS&&['fight','unknown','shop'].includes(n.t)&&canUse(k,'elite');
      })).map(k=>({
        k,
        score:deficient.reduce((sum,route)=>sum+(route.includes(k)?1:0),0)*100
          +(nodes[k].t==='fight'?4:nodes[k].t==='unknown'?2:0)+nodes[k].r/100
      })).filter(x=>x.score>=100).sort((a,b)=>b.score-a.score);
      if(!candidates.length)break;
      nodes[candidates[0].k].t='elite';
    }
    const optionalEliteChance=C.weights.elite/Object.values(C.weights).reduce((s,w)=>s+w,0);
    shuffle(Object.keys(nodes)).forEach(k=>{
      const n=nodes[k];
      if(k!=='boss'&&n.r<ROWS&&['fight','unknown'].includes(n.t)&&Math.random()<optionalEliteChance&&canUse(k,'elite'))n.t='elite';
    });
    const pathRange=(start,type)=>{
      const memo=new Map();
      const visit=k=>{
        if(memo.has(k))return memo.get(k);
        const n=nodes[k],own=n&&n.t===type?1:0;
        if(!n||!n.edges.size){const end={min:own,max:own};memo.set(k,end);return end}
        const next=[...n.edges].map(visit);
        const range={min:own+Math.min(...next.map(x=>x.min)),max:own+Math.max(...next.map(x=>x.max))};
        memo.set(k,range);return range;
      };
      return visit(start);
    };
    const graphValid=starts.length>0&&starts.every(k=>{
      const elites=pathRange(k,'elite'),rests=pathRange(k,'rest');
      const chests=pathRange(k,'chest'),unknowns=pathRange(k,'unknown');
      return elites.min>=minElites&&elites.max<=C.maxElitePerRoute
        &&rests.min>=1&&chests.min===1&&chests.max===1&&unknowns.max<=C.maxUnknownPerRoute;
    })&&Object.entries(nodes).every(([k,n])=>{
      if(n.t==='elite'&&n.r<=C.noEliteBefore)return false;
      return [...n.edges].every(next=>{
        const m=nodes[next];
        return !m||!((n.t==='elite'&&m.t==='elite')||(n.t==='rest'&&m.t==='rest'));
      });
    });
    if(!graphValid){
      if(attempt<60)return this.genMap(attempt+1);
      throw new Error('无法生成满足路线约束的地图');
    }
    this.mapRows=ROWS;this.mapChestRow=chestRow;this.mapRestRow=restRow;this.mapRoutes=routes;
    this.nodes=nodes;
  },
  renderMap(){
    $('screen-map').dataset.act=this.act;
    $('act-banner').textContent=`— ${ACTS[this.act].name} —`;
    $('map-title').textContent=ACTS[this.act].sub;
    const ICON={fight:'⚔️',elite:'💀',rest:'🔥',unknown:'❓',event:'❓',shop:'🏪',chest:'🎁',boss:'☠️'};
    const LBL={fight:'战斗',elite:'精英',rest:'篝火',unknown:'未知',event:'奇遇',shop:'商店',chest:'宝箱',boss:'首领'};
    const W=500,ROWH=86,PAD=46;
    const rows=this.mapRows||7;
    const cols=MAP_RULES.cols||5;
    const H=PAD*2+(rows+1)*ROWH;
    const X=c=>60+c*((W-120)/(cols-1));
    const Y=r=>H-PAD-(r-1)*ROWH;
    const cur=this.curCol>=0?this.nodes[this.row+'-'+this.curCol]:null;
    const avail=new Set();
    if(!cur){Object.values(this.nodes).forEach(n=>{if(n.r===1)avail.add(n.r+'-'+n.c)})}
    else cur.edges.forEach(k=>avail.add(k));
    let edges='',nds='';
    Object.entries(this.nodes).forEach(([k,n])=>{
      n.edges.forEach(k2=>{
        const m=this.nodes[k2];
        const lit=(cur&&k===this.row+'-'+this.curCol&&avail.has(k2));
        edges+=`<path class="medge ${lit?'lit':''}" d="M${X(n.c)} ${Y(n.r)-0} L${X(m.c)} ${Y(m.r)}"/>`;
      });
    });
    Object.entries(this.nodes).forEach(([k,n])=>{
      const isCur=cur&&k===this.row+'-'+this.curCol;
      const isAvail=avail.has(k);
      const isDone=n.r<this.row||(n.r===this.row&&!isCur);
      const R=n.t==='boss'?26:18;
      const cls=`mnode ${isAvail?'avail':''} ${isCur?'cur':''} ${isDone&&!isAvail?'done':''}`;
      const click=isAvail?`role="button" tabindex="0" onclick="G.enterNode('${k}')"`:'';
      nds+=`<g class="${cls}" ${click}>
        ${isAvail?`<circle class="pulse" cx="${X(n.c)}" cy="${Y(n.r)}" r="${R}"/>`:''}
        <circle class="bg" cx="${X(n.c)}" cy="${Y(n.r)}" r="${R}"/>
        <text x="${X(n.c)}" y="${Y(n.r)-2}">${ICON[n.t]}</text>
        <text class="lbl" x="${X(n.c)}" y="${Y(n.r)+R+9}">${LBL[n.t]}</text>
      </g>`;
    });
    $('map-wrap').innerHTML=`<svg id="map-svg" viewBox="0 0 ${W} ${H}">${edges}${nds}</svg>`;
    $('map-progress').textContent=this.row>0?`第 ${this.row} / ${rows+1} 层`:`起点 / ${rows+1} 层`;
    // 自动滚到当前位置附近
    const sc=$('screen-map');
    requestAnimationFrame(()=>{sc.scrollTop=sc.scrollHeight*(1-(this.row+1.6)/(rows+2))});
  },
  resolveUnknown(n){
    const r=Math.random(),U=MAP_RULES.unknown;
    let t='event';
    if(r<U.event)t='event';
    else if(r<U.event+U.fight)t='fight';
    else if(r<U.event+U.fight+U.shop)t='shop';
    else t='chest';
    n.t=t;n.revealed=true;
    return t;
  },
  enterNode(k){
    const n=this.nodes[k];if(!n)return;
    this.row=n.r;this.curCol=n.c;
    this.updateTopbar();SFX.card();
    const t=n.t==='unknown'?this.resolveUnknown(n):n.t;
    if(t==='fight')this.startCombat('fight');
    else if(t==='elite')this.startCombat('elite');
    else if(t==='boss')this.startCombat('boss');
    else if(t==='rest')this.openRest();
    else if(t==='shop')this.openShop();
    else if(t==='event')this.openEvent();
    else if(t==='chest')this.openChest();
  },
  backToMap(){
    this.updateTopbar();this.renderMap();show('screen-map');this.saveRun();
  },

  /* ---------- 牌堆/卡组查看 ---------- */
  viewDeck(){
    const playable=this.deck.filter(c=>!c.unplayable);
    const avg=playable.length?(playable.reduce((sum,c)=>sum+c.c,0)/playable.length).toFixed(1):'0.0';
    const count=t=>this.deck.filter(c=>c.t===t).length;
    this.viewCards('我的卡组',this.deck,`攻击 ${count('atk')} · 技能 ${count('skl')} · 能力 ${count('pwr')} · 诅咒 ${count('curse')} · 平均费用 ${avg}`);
  },
  viewPile(which){
    if(which==='draw')this.viewCards('抽牌堆(顺序已隐藏)',shuffle([...this.drawPile]));
    else if(which==='discard')this.viewCards('弃牌堆',this.discardPile);
    else this.viewCards('消耗堆',this.exhaustPile||[]);
  },
  viewCards(title,cards,summary=''){
    const order={atk:0,skl:1,pwr:2,curse:3};
    const sorted=[...cards].sort((a,b)=>(a.c-b.c)||((order[a.t]??9)-(order[b.t]??9))||a.n.localeCompare(b.n,'zh-CN'));
    const ov=$('overlay');
    ov.innerHTML=`<div class="sec-t" style="font-size:19px">${title} · ${cards.length} 张</div><div class="divider"></div>
      ${summary?`<div class="sec-s">${summary}</div>`:''}
      <div class="cgrid">${sorted.map(c=>`<div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(c,'static')}</div>`).join('')||'<div class="sec-s">(空)</div>'}</div>
      <button class="btn ghost" onclick="G.closeOverlay()">关 闭</button>`;
    ov.classList.add('on');
  },
  pickFromDeck(title,filter,onPick,allowCancel=true,onEmpty=null){
    const list=this.deck.map((c,i)=>({c,i})).filter(x=>filter(x.c));
    if(!list.length){toast('没有符合条件的卡牌');return onEmpty?onEmpty():undefined}
    const ov=$('overlay');
    ov.innerHTML=`<div class="sec-t" style="font-size:19px">${title}</div><div class="divider"></div>
      <div class="cgrid">${list.map(x=>`<div role="button" tabindex="0" style="position:relative;width:var(--card-w);height:var(--card-h)" onclick="G._dp(${x.i})">${cardHTML(x.c,'static')}</div>`).join('')}</div>
      ${allowCancel?'<button class="btn ghost" onclick="G.closeOverlay()">返 回</button>':''}`;
    this._onDp=onPick;ov.classList.add('on');
  },
  _dp(i){const c=this.deck[i];this.closeOverlay();this._onDp(c,i)},
  previewUpgrade(key,isUpgraded=false){
    const base=CARDS[key];if(!base)return;
    const canUp=base.up&&Object.keys(base.up).length;
    const ov=$('overlay');
    if(!this._previewReturnOverlay)this._previewReturnOverlay=ov.classList.contains('on')?{html:ov.innerHTML}:null;
    if(!canUp){
      ov.innerHTML=`<div class="center">
        <div class="sec-t" style="font-size:19px">升级预览</div><div class="divider"></div>
        <div class="sec-s">这张卡没有可预览的升级效果。</div>
        <div style="position:relative;width:var(--card-w);height:var(--card-h);margin:0 auto">${cardHTML(mkCard(key,!!isUpgraded),'static')}</div>
        <button class="btn ghost" onclick="G.closeUpgradePreview()">关 闭</button></div>`;
    }else if(isUpgraded){
      ov.innerHTML=`<div class="center">
        <div class="sec-t" style="font-size:19px">已升级效果</div><div class="divider"></div>
        <div style="position:relative;width:var(--card-w);height:var(--card-h);margin:0 auto">${cardHTML(mkCard(key,true),'static')}</div>
        <button class="btn ghost" onclick="G.closeUpgradePreview()">关 闭</button></div>`;
    }else{
      ov.innerHTML=`<div class="center">
        <div class="sec-t" style="font-size:19px">升级预览</div><div class="divider"></div>
        <div class="cgrid">
          <div><div class="sec-s">当前</div><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(mkCard(key,false),'static')}</div></div>
          <div><div class="sec-s">升级后</div><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(mkCard(key,true),'static')}</div></div>
        </div>
        <button class="btn ghost" onclick="G.closeUpgradePreview()">关 闭</button></div>`;
    }
    ov.classList.add('on');
  },
  closeUpgradePreview(){
    const ov=$('overlay'),ret=this._previewReturnOverlay;
    this._previewReturnOverlay=null;
    if(ret&&ret.html){ov.innerHTML=ret.html;ov.classList.add('on');return}
    this.closeOverlay();
  },
  closeOverlay(){this._previewReturnOverlay=null;$('overlay').classList.remove('on');$('overlay').innerHTML=''},
};
</script>
<script>
/* ====================== 战斗系统 ====================== */
Object.assign(G,{
  makeEnemy(key,hpBonus=0){
    const d=ENEMIES[key];
    const maxHp=Math.max(1,rnd(d.hp[0],d.hp[1])+hpBonus);
    const e={key,n:d.n,sp:d.sp,sprite:d.sprite||"",maxHp,
      moves:d.moves,special:d.special||null,phase2:d.phase2||null,phase2done:false,
      regen:d.regen||0,grow:d.grow?{...d.grow}:null,summonOnly:d.summonOnly||0,
      mi:rnd(0,d.moves.length-1),tc:0,block:0,str:0,weak:0,vuln:0,burn:0,
      stealth:d.stealth||0,thorns:d.thorns||0,
      elite:d.elite||0,boss:d.boss||0};
    e.hp=e.maxHp;return e;
  },
  enemyHpBonus(kind){
    const floor=this.row||1,act=this.act||0;
    const base=Math.floor(floor*1.1)+act*6;
    if(kind==='boss')return 18+act*24;
    if(kind==='elite')return base+10+act*6+Math.floor(floor*.7);
    return base;
  },
  enemyStartStr(kind){
    const floor=this.row||1,act=this.act||0;
    if(kind==='boss')return 1+act;
    if(kind==='elite')return 1+act;
    return (act>=1?1:0)+(floor>=8?1:0);
  },
  enhanceEnemyGrowth(e,kind){
    if(e.summonOnly)return;
    const floor=this.row||1,act=this.act||0;
    let bonus=null;
    if(kind==='boss')bonus={every:3,str:1+Math.floor(act/2),b:6+act*2};
    else if(kind==='elite')bonus={every:3,str:1,b:4+act*2};
    else if(act>0||floor>=6)bonus={every:4,str:1};
    if(!bonus)return;
    const g={...(e.grow||{})};
    g.every=Math.min(g.every||bonus.every,bonus.every);
    if(bonus.str)g.str=(g.str||0)+bonus.str;
    if(bonus.b)g.b=(g.b||0)+bonus.b;
    e.grow=g;
  },
  applyEnemyDifficulty(e,kind){
    if(!e.summonOnly)e.str+=this.enemyStartStr(kind);
    this.enhanceEnemyGrowth(e,kind);
  },
  startCombat(kind){
    this.combatKind=kind;
    const A=ACTS[this.act];
    const mk=key=>this.makeEnemy(key,this.enemyHpBonus(kind));
    if(kind==='boss')this.enemies=A.boss.map(mk);
    else if(kind==='elite')this.enemies=pick(A.elites).map(mk);
    else{
      const dbl=this.row>=3&&Math.random()<(this.act>=1?0.6:0.5);
      this.enemies=[mk(pick(A.pool))];
      if(dbl)this.enemies.push(mk(pick(A.pool)));
    }
    this.enemies.forEach(e=>this.applyEnemyDifficulty(e,kind));
    // 玩家战斗态
    this.block=0;this.str=this.permStr;this.dex=0;this.weak=0;this.vuln=0;this.poison=0;
    this.might=0;this.healMight=0;this.blockMight=0;this.overhealPower=0;this.genjutsu=0;this.chakraDrain=0;
    this.clones=this.hasRelic('contract')?2:0;
    this.nindoBlk=0;this.clonePerTurn=0;this.vulnDrawPower=0;this.vulnDrawReady=false;this.vulnDrawConsumed=false;this.retainBlock=0;
    this.rampStr=0;this.rampSources=[];this.nextTurnEnergy=0;
    this.attacksPlayed=0;this.skillsPlayed=0;
    this.turn=0;this.picked=null;this.busy=false;this.combatEnded=false;
    this._weakFresh=0;this._vulnFresh=0;
    this.drawPile=shuffle(this.deck.map(c=>({...c})));
    this.discardPile=[];this.hand=[];this.exhaustPile=[];
    if(this.hasRelic('kunaibag'))this.block+=5;
    if(this.hasRelic('sage_cloak'))this.block+=8;
    if(this.hasRelic('flak_jacket'))this.block+=6;
    if(this.hasRelic('anbu_mask')&&(kind==='elite'||kind==='boss'))this.str+=1;
    if(this.hasRelic('hokage_cloak')){this.str+=1;this.dex+=1}
    $('stage').className='act'+(this.act+1);
    $('combat-log').textContent=kind==='boss'?`${A.bossName}:「让我见识一下你的实力吧……」`:'战斗开始!';
    show('screen-combat');
    this.startTurn();
  },
  playerEl(){return document.querySelector('#player-side .frame')},
  enemyEl(i){return document.querySelector(`[data-ei="${i}"] .frame`)},

  /* ----- 回合 ----- */
  startTurn(){
    this.turn++;this.stats.turns++;
    if(this.turn>1&&!this.retainBlock)this.block=0;
    const carriedEnergy=this.nextTurnEnergy||0;this.nextTurnEnergy=0;
    this.energy=3
      +carriedEnergy
      +(this.hasRelic('scroll')?1:0)
      +(this.turn===1&&this.hasRelic('hiraishin')?1:0);
    if(this.turn===1&&this.hasRelic('hiraishin'))this.flashRelic('hiraishin');
    const chakraPenalty=Math.min(2,(this.genjutsu||0)+(this.chakraDrain||0));
    if(chakraPenalty){
      this.energy=Math.max(0,this.energy-chakraPenalty);
      this.fxText(this.playerEl(),`查克拉-${chakraPenalty}`,'blk');
      this.genjutsu=0;this.chakraDrain=0;
    }
    this.firstAtk=true;this.firstSkl=true;this.attacksPlayed=0;this.skillsPlayed=0;
    this.vulnDrawConsumed=false;this.vulnDrawReady=this.vulnDrawPower>0;
    if(this.clonePerTurn){this.clones+=this.clonePerTurn;this.fxText(this.playerEl(),'影分身+'+this.clonePerTurn,'blk')}
    if(this.turn===1&&this.hasRelic('chakra_bead')){this.str+=1;this.flashRelic('chakra_bead')}
    if(this.nindoBlk)this.block+=this.nindoBlk;
    this.tickRamp();
    if(this.hasRelic('cells')&&this.hp<this.maxHp){this.hp++;this.flashRelic('cells')}
    if(this.poison>0){
      this.hp-=this.poison;this.fxText(this.playerEl(),'-'+this.poison);SFX.hurt();
      this.poison--;
      if(this.hp<=0){this.updateTopbar();return this.gameOver()}
    }
    this.draw(5+(this.turn===1&&this.hasRelic('book')?2:0)+(this.hasRelic('forbidden_scroll')?1:0));
    this.enemies.forEach(e=>{if(e.hp>0)this.rollIntent(e)});
    this.banner('第 '+this.turn+' 回合 · 我方行动');SFX.turn();
    $('endturn').classList.remove('enemyturn');
    this.updateTopbar();this.renderCombat();
  },
  rollIntent(e){
    e.tc++;
    if(e.special&&e.tc%e.special.every===0)e.intent=e.special.move;
    else{e.intent=e.moves[e.mi%e.moves.length];e.mi++}
  },
  draw(n){
    for(let i=0;i<n;i++){
      if(this.hand.length>=10)break;
      if(!this.drawPile.length){
        if(!this.discardPile.length)break;
        this.drawPile=shuffle(this.discardPile);this.discardPile=[];
      }
      this.hand.push(this.drawPile.pop());
    }
  },
  banner(txt){
    const b=$('turn-banner');b.textContent=txt;
    b.classList.remove('go');void b.offsetWidth;b.classList.add('go');
  },

  /* ----- 出牌交互 ----- */
  cardTargetsAll(c){
    return !!(c.aoe||c.all||c.weak);
  },
  cardHasEnemyEffect(c){
    return !!(c.dmg||c.vuln||c.tvuln||c.tweak||c.weak||c.burn||c.doubleBurn||c.enemyStrDown||c.intentBlockPct);
  },
  cardNeedsTarget(c){
    return this.cardHasEnemyEffect(c)&&!this.cardTargetsAll(c);
  },
  clickCard(i){
    if(this.busy)return;
    const c=this.hand[i];if(!c)return;
    if(c.unplayable){toast('「'+c.n+'」无法打出——这是诅咒');return}
    if(c.c>this.energy){toast('查克拉不足');SFX.blk();return}
    const alive=this.enemies.filter(e=>e.hp>0);
    const needsTarget=this.cardNeedsTarget(c);
    if(this.picked===i){
      if(needsTarget){
        if(alive.length===1)return this.playCardAt(i,alive[0]);
        return toast('点击一个敌人作为目标');
      }
      return this.playCardAt(i,null);
    }
    this.picked=i;SFX.card();
    $('target-hint').classList.toggle('on',needsTarget&&alive.length>1);
    this.renderCombat();
    if(!needsTarget)toast('再次点击该卡打出');
  },
  clickEnemy(i){
    if(this.busy)return;
    const e=this.enemies[i];if(!e||e.hp<=0)return;
    if(this.picked!==null){
      const c=this.hand[this.picked];
      if(c&&this.cardNeedsTarget(c))return this.playCardAt(this.picked,e);
    }
  },
  cancelPick(){
    if(this.picked===null)return;
    this.picked=null;$('target-hint').classList.remove('on');this.renderCombat();
  },
  clickStage(ev){
    if(ev&&ev.target&&ev.target.closest('.card'))return;
    this.cancelPick();
  },
  explainIntent(i){
    if(this.picked!==null)return this.clickEnemy(i);
    const e=this.enemies[i];if(!e||e.hp<=0||!e.intent)return;
    const m=e.intent,parts=[];
    if(m.a)parts.push(`⚔️ 造成 ${this.calc(m.a,e,{vuln:this.vuln})}${(m.hits||1)>1?' × '+m.hits:''} 点伤害`);
    if(m.b)parts.push(`🛡️ 获得 ${m.b} 点格挡`);
    if(m.str)parts.push(`💪 力量 +${m.str}`);
    if(m.heal)parts.push(`💚 回复 ${m.heal} 点生命`);
    if(m.weak)parts.push(`🌀 施加 ${m.weak} 层虚弱`);
    if(m.vulnP)parts.push(`💢 施加 ${m.vulnP} 层易伤`);
    if(m.poison)parts.push(`☠️ 施加 ${m.poison} 层中毒`);
    if(m.stealth)parts.push(`🌫️ 获得 ${m.stealth} 层潜行`);
    if(m.thorns)parts.push(`🪞 获得 ${m.thorns} 层反伤`);
    if(m.genjutsu)parts.push(`👁️ 下回合查克拉 -${m.genjutsu}`);
    if(m.drain)parts.push(`🔵 下回合查克拉 -${m.drain}`);
    if(m.summon)parts.push('➕ 召唤援军');
    if(e.regen)parts.push(`♻️ 行动前最多回复 ${e.regen} 点生命`);
    if(e.grow){
      const gains=[];if(e.grow.str)gains.push(`力量 +${e.grow.str}`);if(e.grow.b)gains.push(`格挡 +${e.grow.b}`);if(e.grow.heal)gains.push(`回复 ${e.grow.heal}`);
      parts.push(`📈 每 ${e.grow.every} 回合成长: ${gains.join('、')}`);
    }
    if(m.genjutsu||m.drain)parts.push('查克拉惩罚合计最多 2 点');
    if(m.a&&this.enemies.filter(x=>x.hp>0).length>1)parts.push('实际伤害可能受前序敌人的状态效果影响');
    toast(`<b>${e.n} · ${m.txt}</b><br>${parts.join('<br>')||'蓄势待发'}`);
  },
  playCardAt(idx,target){
    const c=this.hand[idx];if(!c||c.c>this.energy)return;
    this.picked=null;$('target-hint').classList.remove('on');
    this.cardPlayFx(c);
    this.hand.splice(idx,1);
    this.stats.cards++;
    this.execCard(c,target);
    if(this.hp<=0){this.gameOver();return}
    if(this.combatEnded)return;
    if(c.t==='pwr'||c.ex)this.exhaustPile.push(c);
    else this.discardPile.push(c);
    if(this.checkWin())return;
    this.updateTopbar();this.renderCombat();
  },
  calc(base,att,def){
    let d=base+(att.str||0);
    if(att.weak>0)d=Math.floor(d*0.75);
    if(def.vuln>0)d=Math.floor(d*1.5);
    return Math.max(0,d);
  },
  combatActive(){
    return $('screen-combat').classList.contains('active')&&this.enemies&&this.hand;
  },
  statusBonus(){
    return {v:this.hasRelic('sharingan')?1:0,w:this.hasRelic('seal_tag')?1:0};
  },
  enemyTargets(c,target){
    if(this.cardTargetsAll(c))return this.enemies.filter(e=>e.hp>0);
    return target&&target.hp>0?[target]:[];
  },
  cardAttackBonus(c){
    if(!this.combatActive()||c.t!=='atk'||!this.firstAtk)return 0;
    return (this.hasRelic('fuuma')?4:0)+(this.hasRelic('kyuubi_seal')?6:0);
  },
  cardEffectiveHits(c){
    const cloneHits=c.cloneSpend&&c.cloneExtraHits?Math.min(this.clones||0,c.cloneSpend)*c.cloneExtraHits:0;
    const comboHits=c.comboHits&&this.skillsPlayed>0?c.comboHits:0;
    return (c.hits||1)+cloneHits+comboHits;
  },
  cardConditionalBase(c,target){
    let base=c.dmg||0;
    if(c.damagePerClone)base+=Math.min(this.clones||0,c.cloneScaleCap||99)*c.damagePerClone;
    if(target){
      if(c.bonusVsBurn&&target.burn>0)base+=c.bonusVsBurn;
      if(c.bonusVsWeak&&target.weak>0)base+=c.bonusVsWeak;
      if(c.bonusVsVuln&&target.vuln>0)base+=c.bonusVsVuln;
    }
    return base;
  },
  intentAttackDamage(target){
    const m=target&&target.intent;
    if(!m||!m.a)return 0;
    return this.calc(m.a,target,{vuln:this.vuln});
  },
  cardBlockAmount(c,target=null){
    let block=c.blk||0;
    if(c.blockPerAttacker){
      const attackers=(this.enemies||[]).filter(e=>e.hp>0&&e.intent&&e.intent.a).length;
      block+=attackers*c.blockPerAttacker;
    }
    if(c.intentBlockPct&&target)block+=Math.ceil(this.intentAttackDamage(target)*c.intentBlockPct);
    if(c.blockIfWeak&&target&&target.weak>0)block+=c.blockIfWeak;
    if(c.blockIfTargetAttacking&&target&&target.intent&&target.intent.a)block+=c.blockIfTargetAttacking;
    if(c.blockPerMight)block+=Math.min(this.might||0,c.mightBlockCap||99)*c.blockPerMight;
    if(block>0)block+=this.dex||0;
    return Math.max(0,block);
  },
  cardDamageText(c){
    const bonus=this.cardAttackBonus(c);
    const me={str:this.str||0,weak:this.weak||0};
    const alive=(this.enemies||[]).filter(e=>e.hp>0);
    const targets=alive.length?alive:[{vuln:0,weak:0,burn:0}];
    const vals=[...new Set((targets.length?targets:[{vuln:0}]).map(t=>{
      let d=this.calc(this.cardConditionalBase(c,t)+bonus,me,t);
      if(t.stealth&&!c.ignoreStealth)d=Math.ceil(d*0.5);
      return d;
    }))].sort((a,b)=>a-b);
    return vals.length>1?`${vals[0]}-${vals[vals.length-1]}`:`${vals[0]||0}`;
  },
  cardMightDamageText(c){
    if(!this.combatActive()||c.t!=='atk'||!this.might)return '';
    const alive=(this.enemies||[]).filter(e=>e.hp>0);
    const targets=alive.length?alive:[{vuln:0}];
    const vals=[...new Set((targets.length?targets:[{vuln:0}]).map(t=>{
      let d=this.calc(this.might*(c.mightMultiplier||1),{str:0,weak:this.weak||0},t);
      if(t.stealth&&!c.ignoreStealth)d=Math.ceil(d*0.5);
      return d;
    }))].sort((a,b)=>a-b);
    return vals.length>1?`${vals[0]}-${vals[vals.length-1]}`:`${vals[0]||0}`;
  },
  cardDesc(c){
    if(!this.combatActive())return c.d;
    if(c.unplayable)return c.d;
    const parts=[];
    if(c.dmg){
      const d=this.cardDamageText(c);
      const hits=this.cardEffectiveHits(c);
      const dmg=hits>1?`<b>${d}</b>×<b>${hits}</b>`:`<b>${d}</b>`;
      parts.push(`${c.aoe?'对<b>所有</b>敌人':''}造成 ${dmg} 点伤害`);
    }
    if(c.blk||c.blockPerAttacker)parts.push(`获得 <b>${this.cardBlockAmount(c)}</b> 点格挡`);
    if(c.intentBlockPct){
      const vals=(this.enemies||[]).filter(e=>e.hp>0).map(e=>this.cardBlockAmount(c,e));
      const unique=[...new Set(vals)].sort((a,b)=>a-b);
      const value=unique.length>1?`${unique[0]}-${unique[unique.length-1]}`:`${unique[0]||0}`;
      parts.push(`按目标攻击意图获得 <b>${value}</b> 点格挡`);
    }
    if(c.draw)parts.push(`抽 <b>${c.draw}</b> 张牌`);
    if(c.drawIfMulti)parts.push(`命中至少 2 名敌人时抽 <b>${c.drawIfMulti}</b> 张牌`);
    if(c.drawIfVuln)parts.push(`目标有易伤时抽 <b>${c.drawIfVuln}</b> 张牌`);
    if(c.drawIfDebuffed)parts.push(`任意敌人有负面状态时抽 <b>${c.drawIfDebuffed}</b> 张牌`);
    if(c.drawIfTargetAttacking)parts.push(`目标准备攻击时抽 <b>${c.drawIfTargetAttacking}</b> 张牌`);
    if(c.drawIfAnyAttacker)parts.push(`有敌人准备攻击时抽 <b>${c.drawIfAnyAttacker}</b> 张牌`);
    if(c.lowHpDraw)parts.push(`生命不高于 50% 时抽 <b>${c.lowHpDraw}</b> 张牌`);
    if(c.energy)parts.push(`获得 <b>${c.energy}</b> 点查克拉`);
    if(c.heal)parts.push(`回复 <b>${c.heal}</b> 点生命`);
    if(c.cleanse)parts.push('清除自身中毒、虚弱、易伤');
    if(c.might)parts.push(`获得 <b>${c.might}</b> 层怪力`);
    if(c.gainMightPerTarget)parts.push(`每命中 1 名敌人获得 <b>${c.gainMightPerTarget}</b> 层怪力`);
    if(c.healMight)parts.push(`每次打出回复牌获得 <b>${c.healMight}</b> 层怪力`);
    if(c.blockMight)parts.push(`每次打出格挡牌获得 <b>${c.blockMight}</b> 层怪力`);
    if(c.t==='atk'&&this.might){
      const m=this.cardMightDamageText(c);
      parts.push(`${c.preserveMight?'释放但不消耗':'消耗'}怪力额外造成 <b>${m}</b> 点伤害`);
    }
    if(c.t==='atk'&&!this.might&&c.preserveMight)parts.push('释放怪力但不消耗怪力');
    if(c.mightMultiplier>1)parts.push(`本牌的怪力效果 ×<b>${c.mightMultiplier}</b>`);
    if(c.bonusVsBurn)parts.push(`目标有灼烧时每段额外 +<b>${c.bonusVsBurn}</b> 伤害`);
    if(c.bonusVsWeak)parts.push(`目标有虚弱时每段额外 +<b>${c.bonusVsWeak}</b> 伤害`);
    if(c.bonusVsVuln)parts.push(`目标有易伤时每段额外 +<b>${c.bonusVsVuln}</b> 伤害`);
    if(c.ignoreStealth)parts.push('无视潜行');
    if(c.str)parts.push(`力量 +<b>${c.str}</b>`);
    if(c.dex)parts.push(`身法 +<b>${c.dex}</b>`);
    if(c.clone)parts.push(`获得 <b>${c.clone}</b> 层影分身`);
    if(c.cloneSpend)parts.push(`消耗至多 <b>${c.cloneSpend}</b> 层影分身追加攻击`);
    if(c.clonePerTurn)parts.push(`每回合开始获得 <b>${c.clonePerTurn}</b> 层影分身`);
    if(c.comboHits)parts.push(`本回合打出过技能牌时追加 <b>${c.comboHits}</b> 次攻击`);
    if(c.damagePerClone)parts.push(`每层影分身使每段伤害 +<b>${c.damagePerClone}</b>(至多 ${c.cloneScaleCap||99} 层)`);
    if(c.bonusHitsVsVuln)parts.push(`目标有易伤时追加 <b>${c.bonusHitsVsVuln}</b> 次攻击`);
    if(c.blockIfWeak)parts.push(`目标有虚弱时获得 <b>${c.blockIfWeak}</b> 点格挡`);
    if(c.blockIfTargetAttacking)parts.push(`目标准备攻击时额外获得 <b>${c.blockIfTargetAttacking}</b> 点格挡`);
    if(c.blockPerMight)parts.push(`每层怪力额外获得 <b>${c.blockPerMight}</b> 点格挡(至多 ${c.mightBlockCap||99} 层)`);
    if(c.nindo)parts.push(`每回合开始获得 <b>${c.nindo}</b> 点格挡`);
    if(c.ramp)parts.push(`每回合开始力量 +<b>${c.ramp}</b>,持续 <b>${c.rampTurns||3}</b> 回合`);
    const bonus=this.statusBonus();
    const vuln=(c.vuln||0)+(c.tvuln||0);
    const weak=(c.tweak||0)+(c.weak||0);
    const scope=this.cardTargetsAll(c)?'对所有敌人':'对目标';
    if(vuln)parts.push(`${scope}施加 <b>${vuln+bonus.v}</b> 层易伤`);
    if(weak)parts.push(`${scope}施加 <b>${weak+bonus.w}</b> 层虚弱`);
    if(c.doubleBurn)parts.push('所有敌人的灼烧翻倍');
    if(c.burn)parts.push(`${scope}施加 <b>${c.burn}</b> 层灼烧`);
    if(c.burnBurst)parts.push(`引爆灼烧,每层额外造成 <b>${c.burnBurst}</b> 点伤害`);
    if(c.enemyStrDown)parts.push(`使目标力量 -<b>${c.enemyStrDown}</b>`);
    if(c.blockStrike)parts.push('消耗全部格挡并额外造成等量伤害');
    if(c.overhealPower)parts.push('回复超过生命上限的数值转化为格挡(最多 2 层)');
    if(c.vulnDrawPower)parts.push(`每回合首次施加易伤时抽 <b>${c.vulnDrawPower}</b> 张牌`);
    if(c.retainBlock)parts.push('回合开始时不再失去格挡');
    if(c.doubleMight)parts.push(`当前怪力翻倍(最多 ${c.doubleMightCap||20} 层)`);
    if(c.nextEnergy)parts.push(`下回合查克拉 +<b>${c.nextEnergy}</b>`);
    if(c.retain)parts.push('<b>保留</b>');
    if(c.self)parts.push(`自身受 <b>${c.self}</b> 点伤害`);
    if(c.ex)parts.push('<b>消耗</b>');
    return parts.length?parts.join(', '):c.d;
  },
  damagePlayer(raw,label=''){
    let d=Math.max(0,raw);
    const blocked=Math.min(this.block,d);this.block-=blocked;d-=blocked;
    this.hp-=d;
    if(d>0){
      this.fxText(this.playerEl(),(label?label:'')+'-'+d);SFX.hurt();
      const pu=document.querySelector('#player-side .unit');
      if(pu){pu.classList.add('hitfx');setTimeout(()=>pu.classList.remove('hitfx'),320)}
      if(d>=12){$('stage').classList.add('shake');setTimeout(()=>$('stage').classList.remove('shake'),400)}
    }else if(raw>0){this.fxBlock(this.playerEl());SFX.blk()}
    return d;
  },
  dealDamage(e,raw,pure=false,ignoreStealth=false){
    let d=raw;
    const reflected=!pure?(e.thorns||0):0;
    if(!pure&&e.stealth&&!ignoreStealth){
      d=Math.ceil(d*0.5);
      e.stealth=Math.max(0,e.stealth-1);
      this.fxText(this.enemyEl(this.enemies.indexOf(e)),'潜行减伤','blk');
    }
    const blocked=pure?0:Math.min(e.block,d);
    if(!pure)e.block-=blocked;
    d-=blocked;
    this.stats.dmg+=Math.min(d,Math.max(0,e.hp));
    e.hp-=d;
    const el=this.enemyEl(this.enemies.indexOf(e));
    if(el){
      this.fxSlash(el);
      if(blocked&&!d)this.fxText(el,'格挡!','blk');
      else this.fxText(el,'-'+d);
      el.closest('.unit').classList.add('hitfx');
      setTimeout(()=>el.closest('.unit')&&el.closest('.unit').classList.remove('hitfx'),320);
    }
    SFX.atk();
    if(e.hp<=0)this.handleDeath(e);
    if(reflected&&raw>0&&e.hp>0){
      this.damagePlayer(reflected,'反伤');
      this.fxText(this.enemyEl(this.enemies.indexOf(e)),'反伤','blk');
    }
  },
  handleDeath(e){
    if(e.boss&&e.phase2&&!e.phase2done){
      e.phase2done=true;
      const p=e.phase2;
      e.n=p.n;e.sp=p.sp;e.sprite=p.sprite||e.sprite||"";e.hp=Math.floor(e.maxHp*p.hpRatio);
      e.str+=p.str;e.moves=p.moves;e.special=p.special;e.mi=0;e.tc=0;
      e.regen=p.regen||e.regen||0;e.grow=p.grow?{...p.grow}:(e.grow?{...e.grow}:null);
      e.stealth=p.stealth||0;e.thorns=p.thorns||e.thorns||0;
      this.enhanceEnemyGrowth(e,this.combatKind||'boss');
      this.rollIntent(e);
      this.banner('禁 术 · 解 放');SFX.lose();
      $('stage').classList.add('shake');setTimeout(()=>$('stage').classList.remove('shake'),400);
      toast('首领解放禁术,显露全新形态——战斗进入第二阶段!');
      return;
    }
    if(e.hp<=0&&!e._counted){
      e._counted=true;this.stats.kills++;
      setTimeout(()=>{
        e._gone=true;
        if(!this.combatEnded&&$('screen-combat').classList.contains('active'))this.renderCombat();
      },620);
    }
  },
  execCard(c,target){
    this.energy-=c.c;
    const aliveBefore=this.enemies.filter(e=>e.hp>0);
    const targetWasVuln=!!(target&&target.vuln>0);
    const targetWasAttacking=!!(target&&target.intent&&target.intent.a);
    const hadDebuffedEnemy=aliveBefore.some(e=>e.weak>0||e.vuln>0||e.burn>0);
    const wasLowHp=this.hp<=this.maxHp*.5;
    const storedBlock=this.block;
    let bonus=0;
    if(c.t==='atk'&&this.firstAtk){
      if(this.hasRelic('fuuma')){bonus+=4;this.flashRelic('fuuma')}
      if(this.hasRelic('kyuubi_seal')){bonus+=6;this.flashRelic('kyuubi_seal')}
      this.firstAtk=false;
    }
    if(c.t==='skl'&&this.firstSkl){
      if(this.hasRelic('bell')){this.block+=3;this.fxText(this.playerEl(),'+3','blk');this.flashRelic('bell')}
      if(this.hasRelic('chakra_thread')){this.draw(1);this.flashRelic('chakra_thread')}
      this.firstSkl=false;
    }
    const me={str:this.str,weak:this.weak};
    const statusBonus=this.statusBonus();
    if(c.healMight)this.healMight+=c.healMight;
    if(c.blockMight)this.blockMight+=c.blockMight;
    const cloneSpent=c.dmg&&c.cloneSpend?Math.min(this.clones||0,c.cloneSpend):0;
    const baseHitCount=(c.hits||1)+cloneSpent*(c.cloneExtraHits||0)+(c.comboHits&&this.skillsPlayed>0?c.comboHits:0);
    if(cloneSpent){this.clones-=cloneSpent;this.fxText(this.playerEl(),`影分身-${cloneSpent}`,'blk')}
    if(c.blockStrike&&storedBlock>0){this.block=0;this.fxText(this.playerEl(),`格挡-${storedBlock}`,'blk')}
    const attackMight=c.t==='atk'&&c.dmg?(this.might||0)*(c.mightMultiplier||1):0;
    let hitTargets=0,vulnApplied=false,targetTransformed=false;
    if(c.dmg){
      const ts=c.aoe?this.enemies.filter(e=>e.hp>0):[target];
      for(const t of ts){
        if(!t)continue;
        hitTargets++;
        const hitCount=baseHitCount+(c.bonusHitsVsVuln&&t.vuln>0?c.bonusHitsVsVuln:0);
        let transformed=false;
        for(let h=0;h<hitCount;h++){
          if(t.hp<=0)break;
          const wasPhase2=t.phase2done;
          this.dealDamage(t,this.calc(this.cardConditionalBase(c,t)+bonus,me,t),false,!!c.ignoreStealth);
          if(this.hp<=0)break;
          if(!wasPhase2&&t.phase2done){transformed=true;if(t===target)targetTransformed=true;break}
        }
        if(this.hp<=0)break;
        if(attackMight&&t.hp>0&&!transformed){
          const wasPhase2=t.phase2done;
          this.dealDamage(t,this.calc(attackMight,{str:0,weak:this.weak},t),false,!!c.ignoreStealth);
          if(!wasPhase2&&t.phase2done){transformed=true;if(t===target)targetTransformed=true}
          if(this.hp<=0)break;
        }
        if(c.burnBurst&&t.burn>0&&t.hp>0&&!transformed){
          const layers=t.burn;t.burn=0;
          const wasPhase2=t.phase2done;
          this.dealDamage(t,this.calc(layers*c.burnBurst,{str:0,weak:this.weak},t));
          if(!wasPhase2&&t.phase2done){transformed=true;if(t===target)targetTransformed=true}
          if(this.hp<=0)break;
        }
        if(c.vuln&&t.hp>0){t.vuln+=c.vuln+statusBonus.v;vulnApplied=true}
      }
      if(c.blockStrike&&storedBlock>0&&target&&target.hp>0&&!targetTransformed){
        this.dealDamage(target,this.calc(storedBlock,{str:0,weak:this.weak},target));
      }
      if(attackMight&&!c.preserveMight){
        this.might=0;
        this.fxText(this.playerEl(),'怪力释放','blk');
      }else if(attackMight){
        this.fxText(this.playerEl(),'怪力连携','blk');
      }
      if(c.gainMightPerTarget&&hitTargets)this.gainMight(hitTargets*c.gainMightPerTarget);
      if(this.hp<=0)return;
    }
    const effectTargets=this.enemyTargets(c,target);
    if(c.doubleBurn)effectTargets.forEach(t=>t.burn=Math.min(99,(t.burn||0)*2));
    if(c.burn)effectTargets.forEach(t=>t.burn=Math.min(99,(t.burn||0)+c.burn));
    if(c.tvuln){
      const ts=this.enemyTargets(c,target);ts.forEach(t=>t.vuln+=c.tvuln+statusBonus.v);vulnApplied=ts.length>0||vulnApplied;
    }
    if(c.tweak||c.weak){
      const w=(c.tweak||0)+(c.weak||0)+statusBonus.w;
      this.enemyTargets(c,target).forEach(t=>t.weak+=w);
    }
    if(c.enemyStrDown)effectTargets.forEach(t=>t.str=Math.max(-6,t.str-c.enemyStrDown));
    if(c.blk||c.blockPerAttacker||c.intentBlockPct||c.blockIfWeak||c.blockIfTargetAttacking||c.blockPerMight){
      const b=this.cardBlockAmount(c,target);this.block+=b;this.fxText(this.playerEl(),'+'+b,'blk');SFX.blk();
      if(this.blockMight)this.gainMight(this.blockMight);
    }
    if(c.draw)this.draw(c.draw);
    if(c.drawIfMulti&&c.aoe&&aliveBefore.length>=2)this.draw(c.drawIfMulti);
    if(c.drawIfVuln&&targetWasVuln)this.draw(c.drawIfVuln);
    if(c.drawIfDebuffed&&hadDebuffedEnemy)this.draw(c.drawIfDebuffed);
    if(c.drawIfTargetAttacking&&targetWasAttacking)this.draw(c.drawIfTargetAttacking);
    if(c.drawIfAnyAttacker&&aliveBefore.some(e=>e.intent&&e.intent.a))this.draw(c.drawIfAnyAttacker);
    if(c.lowHpDraw&&wasLowHp)this.draw(c.lowHpDraw);
    if(vulnApplied&&this.vulnDrawReady){this.draw(this.vulnDrawPower);this.vulnDrawReady=false;this.vulnDrawConsumed=true;this.fxText(this.playerEl(),'洞察抽牌','blk')}
    if(c.doubleMight&&this.might){
      const before=this.might;this.might=Math.min(c.doubleMightCap||20,this.might*2);
      this.fxText(this.playerEl(),'怪力+'+(this.might-before),'blk');
    }
    if(c.heal){
      const missing=Math.max(0,this.maxHp-this.hp),overflow=Math.max(0,c.heal-missing);
      this.heal(c.heal);this.fxText(this.playerEl(),'+'+Math.min(c.heal,missing),'heal');
      if(this.overhealPower&&overflow){const b=overflow*this.overhealPower;this.block+=b;this.fxText(this.playerEl(),'盈疗 +'+b,'blk')}
      if(this.healMight)this.gainMight(this.healMight);
    }
    if(c.self){this.hp-=c.self;this.fxText(this.playerEl(),'-'+c.self);if(this.hp<=0){this.updateTopbar();return this.gameOver()}}
    if(c.cleanse){this.poison=0;this.weak=0;this.vuln=0}
    if(c.energy)this.energy+=c.energy;
    if(c.nextEnergy)this.nextTurnEnergy+=c.nextEnergy;
    if(c.clone)this.clones+=c.clone;
    if(c.might)this.gainMight(c.might);
    if(c.str)this.str+=c.str;
    if(c.dex)this.dex+=c.dex;
    if(c.nindo)this.nindoBlk+=c.nindo;
    if(c.clonePerTurn)this.clonePerTurn+=c.clonePerTurn;
    if(c.vulnDrawPower){
      const wasInactive=this.vulnDrawPower<=0;
      this.vulnDrawPower+=c.vulnDrawPower;
      if(wasInactive&&!this.vulnDrawConsumed)this.vulnDrawReady=true;
    }
    if(c.retainBlock)this.retainBlock=1;
    if(c.ramp)this.addRamp(c.ramp,c.rampTurns||3);
    if(c.overhealPower){
      const before=this.overhealPower;this.overhealPower=Math.min(2,this.overhealPower+c.overhealPower);
      if(before===this.overhealPower)this.fxText(this.playerEl(),'盈疗已满','blk');
    }
    if(c.t==='atk')this.attacksPlayed++;
    if(c.t==='skl')this.skillsPlayed++;
    $('combat-log').textContent=`使出「${c.n.replace('⁺','')}」!`;
  },
  checkWin(){
    if(this.hp<=0||this.combatEnded)return false;
    if(this.enemies.every(e=>e.hp<=0)){
      this.busy=true;this.combatEnded=true;
      this.renderCombat();
      setTimeout(()=>this.winCombat(),650);
      return true;
    }
    return false;
  },
  applyEnemyStartEffects(e){
    if(e.hp<=0)return '';
    const parts=[];
    if(e.burn>0){
      const d=e.burn;e.burn=Math.max(0,e.burn-1);
      this.dealDamage(e,d,true);parts.push(`灼烧 -${d}`);
    }
    if(e.hp>0&&e.regen&&e.hp<e.maxHp){
      const h=Math.min(e.regen,e.maxHp-e.hp);
      e.hp+=h;this.fxText(this.enemyEl(this.enemies.indexOf(e)),'+'+h,'heal');parts.push(`再生 +${h}`);
    }
    return parts.join(', ');
  },
  applyEnemyGrowth(e){
    const g=e.grow;
    if(!g||!g.every||e.tc%g.every!==0)return '';
    const parts=[];
    if(g.str){e.str+=g.str;parts.push(`力量 +${g.str}`)}
    if(g.b){e.block+=g.b;parts.push(`格挡 +${g.b}`)}
    if(g.heal&&e.hp>0&&e.hp<e.maxHp){
      const h=Math.min(g.heal,e.maxHp-e.hp);
      e.hp+=h;parts.push(`回复 +${h}`);
    }
    if(parts.length)this.fxText(this.enemyEl(this.enemies.indexOf(e)),parts[0],'blk');
    return parts.length?`蓄势: ${parts.join(', ')}`:'';
  },
  summonEnemies(key,count=1){
    let made=0;
    for(let i=0;i<count;i++){
      if(this.enemies.filter(e=>e.hp>0).length>=3)break;
      const bonus=Math.floor(this.row*0.45)+(this.act*3);
      const s=this.makeEnemy(key,bonus);
      this.enemies.push(s);made++;
    }
    return made;
  },
  applyEnemyMoveEffects(e,m){
    const parts=[];
    if(m.b){e.block+=m.b;parts.push(`格挡 +${m.b}`)}
    if(m.str){e.str+=m.str;parts.push(`力量 +${m.str}`)}
    if(m.heal&&e.hp>0&&e.hp<e.maxHp){
      const h=Math.min(m.heal,e.maxHp-e.hp);
      e.hp+=h;parts.push(`回复 +${h}`);
    }
    if(m.weak){this.weak+=m.weak;this._weakFresh+=m.weak;parts.push(`虚弱 +${m.weak}`)}
    if(m.vulnP){this.vuln+=m.vulnP;this._vulnFresh+=m.vulnP;parts.push(`易伤 +${m.vulnP}`)}
    if(m.poison){this.poison+=m.poison;parts.push(`中毒 +${m.poison}`)}
    if(m.stealth){e.stealth=Math.min(3,(e.stealth||0)+m.stealth);parts.push(`潜行 +${m.stealth}`)}
    if(m.thorns){e.thorns=Math.min(9,(e.thorns||0)+m.thorns);parts.push(`反伤 +${m.thorns}`)}
    if(m.genjutsu){
      const add=Math.min(m.genjutsu,Math.max(0,2-(this.genjutsu||0)-(this.chakraDrain||0)));
      if(add){this.genjutsu=(this.genjutsu||0)+add;parts.push(`幻术 ${add}`)}
    }
    if(m.drain){
      const add=Math.min(m.drain,Math.max(0,2-(this.genjutsu||0)-(this.chakraDrain||0)));
      if(add){this.chakraDrain=(this.chakraDrain||0)+add;parts.push(`查克拉封印 ${add}`)}
    }
    if(m.summon){
      const made=this.summonEnemies(m.summon,m.count||1);
      if(made)parts.push(`召唤 ${made}`);
    }
    if(parts.length)this.fxText(this.enemyEl(this.enemies.indexOf(e)),parts[0],'blk');
    return parts.join(', ');
  },
  endTurn(){
    if(this.busy||this.combatEnded)return;
    this.busy=true;this.picked=null;$('target-hint').classList.remove('on');
    if(this.clones){
      const b=this.clones*3;this.block+=b;
      this.fxText(this.playerEl(),'+'+b,'blk');
      this.clones=Math.max(0,this.clones-1);
      this.fxText(this.playerEl(),'影分身-1','blk');
    }
    const retained=this.hand.filter(c=>c.retain&&!c.unplayable);
    this.discardPile.push(...this.hand.filter(c=>!retained.includes(c)));this.hand=retained;
    $('endturn').classList.add('enemyturn');
    this.banner('敌 方 行 动');
    this.renderCombat();
    const acts=this.enemies.filter(e=>e.hp>0);
    let i=0;
    const step=()=>{
      if(this.combatEnded)return;
      if(this.hp<=0)return this.gameOver();
      if(i>=acts.length){
        this.enemies.forEach(e=>{if(e.weak)e.weak--;if(e.vuln)e.vuln--});
        this.weak=Math.max(this._weakFresh,Math.max(0,this.weak-1));
        this.vuln=Math.max(this._vulnFresh,Math.max(0,this.vuln-1));
        this._weakFresh=0;this._vulnFresh=0;
        this.busy=false;
        return this.startTurn();
      }
      const e=acts[i++];
      if(e.hp<=0)return step();
      e.block=0;
      const ei=this.enemies.indexOf(e);
      const regenText=this.applyEnemyStartEffects(e);
      if(e.hp<=0){
        this.renderCombat();
        if(this.checkWin())return;
        return setTimeout(step,320);
      }
      const m=e.intent;
      const uEl=document.querySelector(`[data-ei="${ei}"]`);
      if(uEl)uEl.classList.add('lunge-l');
      setTimeout(()=>{
        if(this.combatEnded)return;
        if(uEl)uEl.classList.remove('lunge-l');
        if(m){
          if(m.a){
            for(let h=0;h<(m.hits||1);h++){
              let d=this.calc(m.a,e,{vuln:this.vuln});
              this.damagePlayer(d);
              if(this.hp<=0)break;
            }
          }
          if(this.hp<=0){this.updateTopbar();return this.gameOver()}
          const effectText=this.applyEnemyMoveEffects(e,m);
          const growText=this.applyEnemyGrowth(e);
          $('combat-log').textContent=`${e.n} 使出「${m.txt}」${regenText?' · '+regenText:''}${effectText?' · '+effectText:''}${growText?' · '+growText:''}`;
        }
        this.updateTopbar();this.renderCombat();
        setTimeout(step,460);
      },200);
    };
    setTimeout(step,650);
  },

  /* ----- 特效 ----- */
  fxText(anchor,txt,cls=''){
    if(!anchor)return;
    const r=anchor.getBoundingClientRect(),a=$('app').getBoundingClientRect();
    const f=document.createElement('div');
    f.className='fdmg '+cls;f.textContent=txt;
    f.style.left=(r.left-a.left+r.width/2-16+rnd(-14,14))+'px';
    f.style.top=(r.top-a.top+rnd(0,16))+'px';
    $('app').appendChild(f);setTimeout(()=>f.remove(),900);
  },
  cardPlayFx(c){
    const stage=$('stage');if(!stage)return;
    const fx=document.createElement('div');
    fx.className=`technique-callout ${c.t}`;
    fx.innerHTML=`<small>${TYPE_LABEL[c.t]||'忍术'} / NINJUTSU</small><b>${c.n.replace('⁺','')}</b>`;
    stage.appendChild(fx);setTimeout(()=>fx.remove(),1050);
  },
  fxSlash(anchor){
    if(!anchor)return;
    const r=anchor.getBoundingClientRect(),a=$('app').getBoundingClientRect();
    const f=document.createElement('div');f.className='slashfx';
    f.style.left=(r.left-a.left+r.width/2-45)+'px';
    f.style.top=(r.top-a.top+r.height/2-45)+'px';
    $('app').appendChild(f);setTimeout(()=>f.remove(),420);
  },
  fxBlock(anchor){
    if(!anchor)return;
    const r=anchor.getBoundingClientRect(),a=$('app').getBoundingClientRect();
    const f=document.createElement('div');f.className='blockfx';f.textContent='🛡️';
    f.style.left=(r.left-a.left+r.width/2-17)+'px';
    f.style.top=(r.top-a.top+r.height/2-22)+'px';
    $('app').appendChild(f);setTimeout(()=>f.remove(),560);
  },

  /* ----- 渲染 ----- */
  intentHTML(e){
    const m=e.intent;if(!m)return '…';
    let p=[];
    if(m.a){
      const d=this.calc(m.a,e,{vuln:this.vuln});
      p.push(`⚔️<b>${d}${(m.hits||1)>1?'×'+m.hits:''}</b>`);
    }
    if(m.b)p.push(`<span class="ib">🛡️${m.b}</span>`);
    if(m.str)p.push('💪');
    if(m.heal)p.push('💚');
    if(m.weak)p.push('🌀');
    if(m.vulnP)p.push('💢');
    if(m.poison)p.push('☠️');
    if(m.stealth)p.push('🌫️');
    if(m.thorns)p.push(`🪞${m.thorns}`);
    if(m.genjutsu)p.push('👁️');
    if(m.drain)p.push('🔵↓');
    if(m.summon)p.push('➕');
    return p.join(' ');
  },
  stTags(o,isPlayer){
    const T=[];
    const add=(name,val,buff)=>T.push(`<button type="button" class="stag ${buff?'buff':'debuff'}" data-kw="${name}" aria-label="${esc(name+': '+(KW[name]||''))}" aria-describedby="keyword-tip" onmouseenter="G.showKeyword(event,this)" onmouseleave="G.hideKeyword()" onfocus="G.showKeyword(event,this)" onblur="G.hideKeyword()" onclick="event.preventDefault();event.stopPropagation();G.showKeyword(event,this,true)">${name}${val}</button>`);
    if(o.str)add('力量',o.str,o.str>0);
    if(o.weak)add('虚弱',o.weak,false);
    if(o.vuln)add('易伤',o.vuln,false);
    if(o.regen)add('再生',o.regen,true);
    if(o.grow)add('蓄势','',true);
    if(o.stealth)add('潜行',o.stealth,true);
    if(o.thorns)add('反伤',o.thorns,true);
    if(o.burn)add('灼烧',o.burn,false);
    if(isPlayer){
      if(this.might)add('怪力',this.might,true);
      if(this.dex)add('身法',this.dex,true);
      if(this.clones)add('影分身',this.clones,true);
      if(this.nindoBlk)add('忍道',this.nindoBlk,true);
      if(this.rampStr)add('九尾',this.rampStr,true);
      if(this.healMight)add('医术',this.healMight,true);
      if(this.blockMight)add('聚力',this.blockMight,true);
      if(this.overhealPower)add('盈疗',this.overhealPower,true);
      if(this.nextTurnEnergy)add('蓄能',this.nextTurnEnergy,true);
      if(this.clonePerTurn)add('分身术式',this.clonePerTurn,true);
      if(this.vulnDrawPower)add('洞察',this.vulnDrawPower,true);
      if(this.retainBlock)add('固守','',true);
      if(this.genjutsu)add('幻术',this.genjutsu,false);
      if(this.chakraDrain)add('查克拉封印',this.chakraDrain,false);
      if(this.poison)add('中毒',this.poison,false);
    }
    return T.join('');
  },
  renderCombat(){
    const C=this.char();
    // 玩家
    const cancelAttrs=this.picked!==null?'role="button" tabindex="0" aria-label="取消选牌"':'';
    $('player-side').innerHTML=`<div class="unit player" ${cancelAttrs} onclick="G.cancelPick()">
      ${unitFrame(C.face,C.sprite,C.n)}
      <div class="uname">${C.n} ${this.block?`<span class="ub">🛡️${this.block}</span>`:''}</div>
      <div class="hpbar pb"><i style="width:${Math.max(0,this.hp/this.maxHp*100)}%"></i></div>
      <div class="hptx">${Math.max(0,this.hp)} / ${this.maxHp}</div>
      <div class="strow">${this.stTags({str:this.str,weak:this.weak,vuln:this.vuln},true)}</div>
    </div>`;
    // 敌人
    $('enemy-side').innerHTML=this.enemies.map((e,i)=>{
      if(e._gone)return '';
      const dead=e.hp<=0;
      const pickedTarget=this.picked!==null&&this.hand[this.picked]&&this.cardNeedsTarget(this.hand[this.picked]);
      const targetAttrs=pickedTarget&&!dead?'role="button" tabindex="0"':'';
      return `<div class="enemy-slot ${dead?'dead':''}">
        <button type="button" class="intent" onclick="event.stopPropagation();G.explainIntent(${i})">${dead?'':this.intentHTML(e)+' <span style="opacity:.65;font-size:11px">'+(e.intent?e.intent.txt:'')+'</span>'}</button>
        <div class="unit ${dead?'dead':''} ${e.elite?'elite':''} ${e.boss?'boss':''} ${!dead?'targetable':''} ${pickedTarget&&!dead?'target-glow':''}" ${targetAttrs} data-ei="${i}" onclick="G.clickEnemy(${i})">
          ${unitFrame(e.sp,e.sprite,e.n)}
          <div class="uname">${e.n} ${e.block?`<span class="ub">🛡️${e.block}</span>`:''}</div>
          <div class="hpbar"><i style="width:${Math.max(0,e.hp/e.maxHp*100)}%"></i></div>
          <div class="hptx">${Math.max(0,e.hp)} / ${e.maxHp}</div>
          <div class="strow">${this.stTags(e)}</div>
        </div>
      </div>`;
    }).join('');
    // 手牌(扇形)
    const hand=$('hand');
    const W=hand.clientWidth||300;
    const n=this.hand.length;
    const cardW=cardWidth();
    const gap=n>1?Math.min(cardW*0.82,(W-cardW-10)/(n-1)):0;
    const startX=(W-(cardW+gap*(n-1)))/2;
    hand.innerHTML=this.hand.map((c,i)=>{
      const mid=(n-1)/2;
      const rot=n>1?(i-mid)*Math.min(4.5,26/n):0;
      const ty=Math.abs(i-mid)*Math.min(3.5,16/n);
      const cls=['inhand'];
      if(c.c>this.energy&&!c.unplayable)cls.push('noafford');
      if(c.unplayable)cls.push('noafford');
      if(this.picked===i)cls.push('picked');
      const st=`left:${startX+i*gap}px;bottom:16px;transform:rotate(${rot}deg) translateY(${ty}px);z-index:${10+i}`;
      return `<div onclick="event.stopPropagation();G.clickCard(${i})" style="display:contents">${cardHTML(c,cls.join(' '),st)}</div>`;
    }).join('');
    // 信息
    $('n-energy').textContent=this.energy;
    $('orb').classList.toggle('zero',this.energy===0);
    $('n-draw').textContent=this.drawPile.length;
    $('n-discard').textContent=this.discardPile.length;
    $('n-exhaust').textContent=this.exhaustPile.length;
    const canPlay=!this.busy&&!this.combatEnded&&this.hand.some(c=>!c.unplayable&&c.c<=this.energy);
    $('endturn').classList.toggle('hint',canPlay);
  },
});
window.addEventListener('resize',()=>{
  CARD_W_CACHE=0;
  if($('screen-combat').classList.contains('active')&&G.hand)G.renderCombat();
});
document.addEventListener('click',e=>{
  if(!$('screen-combat').classList.contains('active'))return;
  if(e.target.closest('#stage')&&!e.target.closest('.unit'))G.clickStage(e);
});
let cardLongPress=null;
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  if(e.target.closest&&e.target.closest('.kw'))return;
  const card=e.target.closest&&e.target.closest('.card');if(!card)return;
  if(cardLongPress)clearTimeout(cardLongPress.timer);
  const x=e.clientX,y=e.clientY;
  cardLongPress={x,y,timer:setTimeout(()=>{
    G._suppressCardClickUntil=performance.now()+700;
    G.previewUpgrade(card.dataset.cardKey,card.dataset.upgraded==='1');
    cardLongPress=null;
  },550)};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!cardLongPress)return;
  if(Math.hypot(e.clientX-cardLongPress.x,e.clientY-cardLongPress.y)>10){clearTimeout(cardLongPress.timer);cardLongPress=null}
},{passive:true});
['pointerup','pointercancel'].forEach(type=>document.addEventListener(type,()=>{
  if(cardLongPress){clearTimeout(cardLongPress.timer);cardLongPress=null}
},{passive:true}));
document.addEventListener('click',e=>{
  if(G._suppressCardClickUntil>performance.now()&&e.target.closest&&e.target.closest('.card')){
    e.preventDefault();e.stopImmediatePropagation();
  }
},true);
document.addEventListener('keydown',e=>{
  if(e.repeat||(e.key!=='Enter'&&e.key!==' '))return;
  if(e.target.closest&&e.target.closest('button,a,input,select,textarea'))return;
  const target=e.target.closest&&e.target.closest('[role="button"]');if(!target)return;
  e.preventDefault();target.dispatchEvent(new MouseEvent('click',{bubbles:true}));
});
</script>
<script>
/* ====================== 奖励 / 篝火 / 商店 / 事件 / 结算 ====================== */
Object.assign(G,{
  winCombat(){
    const kind=this.combatKind;
    if(this.hasRelic('ramen'))this.heal(3);
    if(this.hasRelic('slug_charm')&&this.hp<this.maxHp/2)this.heal(5);
    if(kind==='elite')this.stats.elites++;
    SFX.win();
    this._pendingPotion=null;this._cardPicked=false;
    if(kind==='boss')return this.bossReward();
    let gold=kind==='elite'?rnd(50,70):rnd(20,34);
    let goldMul=1;
    if(this.hasRelic('dice'))goldMul+=0.4;
    if(this.hasRelic('mission_pass'))goldMul+=0.2;
    gold=Math.floor(gold*goldMul);
    this.gold+=gold;SFX.gold();this.updateTopbar();
    let html=`<div class="ritem noclick">🪙 缴获 ${gold} 金币</div>`;
    if(kind==='elite'){
      const r=this.randomRelic();
      if(r){this.addRelic(r);html+=`<div class="ritem noclick">${RELICS[r].ic} 获得忍具「${RELICS[r].n}」<br><span style="color:var(--paper-dim);font-size:12.5px">${RELICS[r].d}</span></div>`}
    }
    if(Math.random()<(kind==='elite'?MAP_RULES.potionDrop.elite:MAP_RULES.potionDrop.fight)){
      const pk=this.randomPotionKey();
      this._pendingPotion=pk;
      html+=`<div class="ritem" role="button" tabindex="0" id="potion-take" onclick="G.takePotion()">${POTIONS[pk].ic} 拾取秘药「${POTIONS[pk].n}」— ${POTIONS[pk].d}</div>`;
    }
    html+=`<div class="sec-s" style="margin-top:10px">领悟新忍术 — 选择一张加入卡组(可跳过)</div>`;
    const cs=this.combatRewardCards(kind);
    this._choices=cs;this._cardPicked=false;
    html+=`<div class="cgrid" id="card-reward-grid">${cs.map((c,i)=>`<div role="button" tabindex="0" style="position:relative;width:var(--card-w);height:var(--card-h)" onclick="G.takeCard(${i})">${cardHTML(c,'static')}</div>`).join('')}</div>
      <div class="sec-s" id="card-reward-status"></div>`;
    html+=`<button class="btn ghost" id="reward-continue" onclick="G.backToMap()">跳过,继续前进</button>`;
    $('reward-list').innerHTML=html;
    show('screen-reward');
  },
  takePotion(){
    if(this._pendingPotion&&this.addPotion(this._pendingPotion)){
      SFX.potion();toast(`收下「${POTIONS[this._pendingPotion].n}」`);
      const el=$('potion-take');if(el){el.classList.add('noclick');el.style.opacity=.4}
      this._pendingPotion=null;
      const status=$('card-reward-status');
      if(status&&this._cardPicked)status.textContent='奖励已领取完毕';
    }
  },
  takeCard(i){
    if(this._cardPicked)return toast('只能领悟一张');
    const c=this._choices[i];if(!c)return;
    this.deck.push(c);this._cardPicked=true;this._choices=[];
    SFX.card();toast(`「${c.n}」加入卡组`);
    const grid=$('card-reward-grid');
    if(grid){grid.classList.add('sold');grid.style.pointerEvents='none'}
    const status=$('card-reward-status');
    if(status)status.textContent=this._pendingPotion?'已选择卡牌,还可以拾取秘药':'已选择卡牌';
    const btn=$('reward-continue');if(btn)btn.textContent='继续前进';
    this.updateTopbar();
  },
  bossReward(){
    const isFinal=this.act>=ACTS.length-1;
    if(isFinal)return this.victory();
    const A=ACTS[this.act],next=ACTS[this.act+1];
    const gold=rnd(90,110);this.gold+=gold;
    const healAmt=Math.floor(this.maxHp*0.4);this.heal(healAmt);
    const bossRelics=this.randomBossRelics(1);
    bossRelics.forEach(k=>this.addRelic(k));
    this.updateTopbar();
    const relicHtml=bossRelics.length
      ? bossRelics.map(k=>`<div class="ritem noclick">${BOSS_RELICS[k].ic} 获得首领忍具「${BOSS_RELICS[k].n}」<br><span style="color:var(--paper-dim);font-size:12.5px">${BOSS_RELICS[k].d}</span></div>`).join('')
      : '<div class="ritem noclick">🪙 首领忍具已经收集齐全,额外缴获 120 金币</div>';
    if(!bossRelics.length){this.gold+=120;this.updateTopbar()}
    let html=`<div class="sec-s" style="font-size:14px">${A.clearText||`${A.bossName}败退,通往${next.name}的路出现了。`}</div>
      <div class="ritem noclick">🪙 缴获 ${gold} 金币 · 💚 休整回复 ${healAmt} 点生命</div>
      <div class="sec-s" style="margin-top:12px;color:var(--gold)">◆ 首领战利品 ◆</div>
      ${relicHtml}
      <div class="sec-s" style="margin-top:10px">领悟一张稀有忍术 — 可跳过</div>`;
    const cs=this.randomCards(3,2).map(c=>this.maybeUpgradeRewardCard(c,this.rewardUpgradeChance('boss')));
    this._choices=cs;this._cardPicked=false;
    html+=`<div class="cgrid" id="boss-card-reward-grid">${cs.map((c,i)=>`<div role="button" tabindex="0" style="position:relative;width:var(--card-w);height:var(--card-h)" onclick="G.takeBossCard(${i})">${cardHTML(c,'static')}</div>`).join('')}</div>
      <div class="sec-s" id="boss-card-reward-status"></div>
      <button class="btn" onclick="G.toNextAct()">进入${next.name.split(' · ')[0]} →</button>`;
    $('reward-list').innerHTML=html;
    show('screen-reward');
  },
  takeBossCard(i){
    if(this._cardPicked)return toast('只能领悟一张');
    const c=this._choices[i];if(!c)return;
    this._cardPicked=true;this.deck.push(c);this._choices=[];
    const grid=$('boss-card-reward-grid');
    if(grid){
      grid.innerHTML=`<div><div class="sec-s">已选忍术</div><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(c,'static')}</div></div>`;
      grid.style.pointerEvents='none';
    }
    const status=$('boss-card-reward-status');
    if(status)status.textContent='未选择的忍术已经离开奖励池';
    SFX.card();
    toast(`「${c.n}」加入卡组`);
  },
  toNextAct(){
    this.startAct(this.act+1);
  },

  /* ---------- 宝箱 ---------- */
  openChest(){
    const r=this.randomRelic();
    let body;
    if(r){
      this.addRelic(r);SFX.gold();
      body=`<div class="ritem noclick">${RELICS[r].ic} 获得忍具「${RELICS[r].n}」<br><span style="color:var(--paper-dim);font-size:12.5px">${RELICS[r].d}</span></div>`;
    }else{
      this.gold+=85;SFX.gold();this.updateTopbar();
      body='<div class="ritem noclick">🪙 忍具已经收集齐全,你找到了 85 金币</div>';
    }
    $('event-box').innerHTML=`<div class="eic">🎁</div>
      <div class="sec-t" style="font-size:19px;letter-spacing:.18em">补给宝箱</div>
      <p>封印锁应声打开,里面是一份为下一段路准备的补给。</p>
      ${body}<button class="btn" onclick="G.backToMap()">继续前进</button>`;
    show('screen-event');
  },

  /* ---------- 篝火 ---------- */
  openRest(){
    const pct=this.hasRelic('medkit')?0.5:0.3;
    const amt=Math.floor(this.maxHp*pct);
    $('screen-rest').innerHTML=`
      <div class="rest-shell">
        <div class="act-banner">SAFE HOUSE / 安全据点</div>
        <div class="sec-t">篝 火</div>
        <div class="sec-s">夜色暂时掩住了追兵，只够完成一项准备</div>
        <div class="divider"></div>
        <div class="rest-choices">
          <div class="rest-choice" role="button" tabindex="0" onclick="G.restHeal(${amt})"><span class="choice-icon">🍙</span><b>打坐调息</b><span>回复 ${amt} 点生命 · ${Math.round(pct*100)}% 最大生命</span></div>
          <div class="rest-choice" role="button" tabindex="0" onclick="G.restUpgrade()"><span class="choice-icon">📜</span><b>修炼忍术</b><span>永久升级一张未强化的卡牌</span></div>
        </div>
      </div>`;
    show('screen-rest');
  },
  restHeal(amt){this.heal(amt);toast(`回复了 ${amt} 点生命`);this.backToMap()},
  restUpgrade(){
    this.pickFromDeck('选择要升级的忍术',c=>!c.upgraded&&c.t!=='curse',(c)=>{
      this.confirmRestUpgrade(c);
    });
  },
  confirmRestUpgrade(c){
    this._upgradeCard=c;
    $('overlay').innerHTML=`<div class="center">
      <div class="sec-t" style="font-size:19px">确认修炼</div><div class="divider"></div>
      <div class="cgrid">
        <div><div class="sec-s">当前</div><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(c,'static')}</div></div>
        <div><div class="sec-s">升级后</div><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(mkCard(c.key,true),'static')}</div></div>
      </div>
      <div class="overlay-actions">
        <button class="btn" onclick="G.applyRestUpgrade()">确认升级</button>
        <button class="btn ghost" onclick="G.reselectRestUpgrade()">重新选择</button>
      </div>
    </div>`;
    $('overlay').classList.add('on');
  },
  reselectRestUpgrade(){
    this._upgradeCard=null;
    this._previewReturnOverlay=null;
    this.restUpgrade();
  },
  applyRestUpgrade(){
    const c=this._upgradeCard;
    if(!c||c.upgraded)return this.closeOverlay();
    upgradeCard(c);this._upgradeCard=null;this.closeOverlay();
    SFX.heal();toast(`「${c.n}」修炼成功!`);this.backToMap();
  },

  /* ---------- 商店 ---------- */
  openShop(){
    this.shopCards=this.randomCards(2,1);
    this.shopCards.push(this.randomCard(2,this.shopCards.map(c=>c.key)));
    this.shopPrices=this.shopCards.map(c=>c.r>=3?165:(c.r===2?110:60));
    this.shopRelics=this.randomRelics(MAP_RULES.shopRelicSlots);
    this.shopPotion=this.randomPotionKey();
    this.removeUsed=false;
    this.renderShop();show('screen-shop');
  },
  renderShop(){
    const aff=p=>this.gold>=p?'':'cant';
    let h=`<div class="shop-shell"><div class="act-banner">TRAVELING MERCHANT / 行商补给</div><div class="sec-t">行商的帐篷</div>
      <div class="sec-s">“钱可以买不到忍道，但能让你活着走得更远。” · 持有 <b style="color:var(--gold)">${this.gold}</b> 金币</div>
      <div class="divider"></div><div class="shop-section-title">忍术卷轴</div><div class="cgrid shop-shelf">`;
    h+=this.shopCards.map((c,i)=>{
      if(!c)return `<div style="width:var(--card-w);text-align:center;color:var(--paper-dim);padding-top:60px">已售出</div>`;
      return `<div role="button" tabindex="0" onclick="G.buyCard(${i})"><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(c,'static')}</div>
        <div class="price ${aff(this.shopPrices[i])}">🪙 ${this.shopPrices[i]}</div></div>`;
    }).join('');
    h+=`</div><div class="shop-section-title">忍具与秘药</div><div class="cgrid shop-shelf">`;
    if(this.shopRelics.length){
      h+=this.shopRelics.map((k,i)=>{
        if(!k)return `<div class="shop-relic sold"><div class="ric">✓</div><div class="rname">已售出</div><div class="rdesc">这件忍具已经收入囊中</div></div>`;
        const r=RELICS[k];
        return `<div class="shop-relic" role="button" tabindex="0" onclick="G.buyRelic(${i})"><div class="ric">${r.ic}</div><div class="rname">${r.n}</div><div class="rdesc">${r.d}</div><div class="price ${aff(150)}">🪙 150</div></div>`;
      }).join('');
    }
    if(this.shopPotion){const p=POTIONS[this.shopPotion];
      h+=`<div class="shop-relic" role="button" tabindex="0" onclick="G.buyPotion()" style="border-color:var(--chakra)"><div class="ric">${p.ic}</div><div class="rname" style="color:var(--chakra)">${p.n}</div><div class="rdesc">${p.d}</div><div class="price ${aff(45)}">🪙 45</div></div>`}
    h+=`<div class="shop-relic ${this.removeUsed?'sold':''}" role="button" tabindex="0" onclick="G.buyRemove()"><div class="ric">🗑️</div><div class="rname">删卡服务</div><div class="rdesc">从卡组中永久移除一张卡牌</div><div class="price ${aff(75)}">🪙 75</div></div>`;
    h+=`</div><div class="center" style="margin-top:18px"><button class="btn ghost" onclick="G.backToMap()">离开商店</button></div></div>`;
    $('screen-shop').innerHTML=h;
  },
  buyCard(i){
    const c=this.shopCards[i];if(!c)return;
    if(this.gold<this.shopPrices[i])return toast('金币不足');
    this.gold-=this.shopPrices[i];this.deck.push(c);this.shopCards[i]=null;
    SFX.gold();toast(`购入「${c.n}」`);this.updateTopbar();this.renderShop();
  },
  buyRelic(i){
    if(!this.shopRelics||!this.shopRelics[i])return;
    if(this.gold<150)return toast('金币不足');
    this.gold-=150;const r=this.shopRelics[i];this.shopRelics[i]=null;
    this.addRelic(r);SFX.gold();toast(`获得「${RELICS[r].n}」`);this.renderShop();
  },
  buyPotion(){
    if(!this.shopPotion)return;
    if(this.gold<45)return toast('金币不足');
    if(!this.addPotion(this.shopPotion))return;
    this.gold-=45;this.shopPotion=null;
    SFX.gold();this.updateTopbar();this.renderShop();
  },
  buyRemove(){
    if(this.removeUsed)return;
    if(this.gold<75)return toast('金币不足');
    this.pickFromDeck('选择要移除的卡牌',()=>true,(c,idx)=>{
      this.gold-=75;this.removeUsed=true;this.deck.splice(idx,1);
      SFX.card();toast(`移除了「${c.n}」`);this.updateTopbar();this.renderShop();show('screen-shop');
    });
  },

  /* ---------- 奇遇 ---------- */
  openEvent(){
    const ev=pick(EVENTS);this._event=ev;
    $('event-box').innerHTML=`<div class="eic">${ev.ic}</div>
      <div class="sec-t" style="font-size:19px;letter-spacing:.18em">${ev.title}</div>
      <p>${ev.text}</p>
      <div class="eopts">${ev.opts.map((o,i)=>{
        const ok=!o.cond||o.cond(this);
        return `<button class="btn ghost" ${ok?'':'disabled'} onclick="G.eventChoice(${i})">${o.t}</button>`}).join('')}</div>`;
    show('screen-event');
  },
  eventChoice(i){
    const r=this._event.opts[i].f(this);
    this.updateTopbar();
    if(this.hp<=0)return;
    if(this.pendingRemove){
      this.pendingRemove=false;
      return this.pickFromDeck('选择要移除的卡牌',()=>true,(c,idx)=>{
        this.deck.splice(idx,1);toast(`移除了「${c.n}」`);this.backToMap();
      },false,()=>this.backToMap());
    }
    $('event-box').innerHTML=`<div class="eic">${this._event.ic}</div>
      <p>${r}</p><button class="btn" onclick="G.backToMap()">继续前进</button>`;
  },

  /* ---------- 结算 ---------- */
  statHTML(){
    return `<div class="statline">
      <span>总伤害 <b>${this.stats.dmg}</b></span><span>击败敌人 <b>${this.stats.kills}</b></span>
      <span>出牌 <b>${this.stats.cards}</b></span><span>历经回合 <b>${this.stats.turns}</b></span>
      <span>精英战 <b>${this.stats.elites}</b></span><span>卡组 <b>${this.deck.length}</b> 张</span>
      <span>忍具 <b>${this.relics.length}</b> 件</span></div>`;
  },
  gameOver(){
    if(this._ended)return;this._ended=true;
    this.combatEnded=true;this.busy=true;
    this.clearSave();
    this.hp=0;this.updateTopbar();SFX.lose();
    $('end-content').innerHTML=`
      <div style="font-size:60px">⚰️</div>
      <div class="title-main" style="font-size:40px;color:#e05a5a;background:none;-webkit-background-clip:unset;filter:none">任 务 失 败</div>
      <p style="color:var(--paper-dim);text-align:center;line-height:2">你倒在了 ${ACTS[this.act].name} · 第 ${this.row} 层。<br>但忍者的意志不会就此熄灭。</p>
      ${this.statHTML()}
      <button class="btn" style="margin-top:14px" onclick="G.returnToTitle()">重新选择角色</button>`;
    show('screen-end');
  },
  victory(){
    this._ended=true;this.combatEnded=true;this.busy=true;this.clearSave();
    SFX.win();this.updateTopbar();
    $('end-content').innerHTML=`
      <div class="uzu-wrap" style="margin:0 auto"><div class="uzu"></div><div class="uzu u2"></div><div class="uzu-core">🍥</div></div>
      <div class="title-main" style="font-size:40px">任 务 完 成</div>
      <p style="text-align:center;line-height:2.1;font-size:14.5px">须佐能乎的光芒在黎明前消散,黑底红云退入远方。<br>
      你带着情报回到木叶,新的道路仍在脚下延伸。<br>
      <b style="color:var(--naruto);font-size:17px">「这就是——我的忍道!」</b></p>
      ${this.statHTML()}
      <button class="btn" style="margin-top:14px" onclick="G.returnToTitle()">开启新的轮回</button>`;
    show('screen-end');
  },
});
window.G=G;window.CHARACTERS=CHARACTERS;window.CARDS=CARDS;window.RELICS=RELICS;window.BOSS_RELICS=BOSS_RELICS;window.POTIONS=POTIONS;window.ENEMIES=ENEMIES;window.ACTS=ACTS;window.MAP_RULES=MAP_RULES;window.mkCard=mkCard;window.upgradeCard=upgradeCard;
G.renderContinue();
</script>
</body>
</html>
