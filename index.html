<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>忍道之路 · NINDO</title>
<style>
:root{
  --ink:#0f0c07; --ink2:#1a1409; --panel:#211a0e;
  --paper:#ecdcb4; --paper-dim:#a89a78;
  --naruto:#ff7a1a; --chakra:#54b8f0; --seal:#c03022;
  --gold:#e0a83e; --hp:#e04848; --block:#86c5ea;
  --atk:#e06548; --skl:#52b3a4; --pwr:#a87fd6; --curse:#6b6b6b;
  --card-w:144px; --card-h:206px; --card-art-h:84px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:"Noto Serif SC","Songti SC","STSong",serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;
}
button{font-family:inherit}
#app{width:100vw;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ============ 顶栏 ============ */
#topbar{
  display:none;align-items:center;gap:12px;padding:6px 12px;
  border-bottom:1px solid rgba(236,220,180,.14);
  font-size:13.5px;min-height:42px;flex-wrap:wrap;z-index:20;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.1));
}
#topbar.on{display:flex}
.tstat{display:flex;align-items:center;gap:4px;white-space:nowrap}
.tstat.hp{color:#ef6a6a}.tstat.gd{color:var(--gold)}.tstat.fl{color:var(--paper-dim)}.tstat.ch{color:var(--chakra)}
.tbtn{background:none;border:1px solid rgba(236,220,180,.25);color:var(--paper-dim);
  border-radius:4px;padding:2px 9px;font-size:12px;cursor:pointer}
.tbtn:active{background:rgba(255,255,255,.08)}
#relicbar{display:flex;gap:5px;flex-wrap:wrap}
.relic-i{width:25px;height:25px;border-radius:50%;cursor:pointer;font-size:13px;
  background:radial-gradient(circle at 35% 30%,#41351e,#191204);
  border:1px solid var(--gold);display:flex;align-items:center;justify-content:center}
#potionbar{display:flex;gap:5px}
.potion-i{width:25px;height:25px;border-radius:6px;cursor:pointer;font-size:13px;
  background:radial-gradient(circle at 35% 30%,#23303d,#0d1217);
  border:1px solid var(--chakra);display:flex;align-items:center;justify-content:center}
.potion-i.empty{opacity:.25;border-style:dashed;cursor:default}

/* ============ 屏幕 ============ */
.screen{flex:1;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:14px;position:relative}
.screen.active{display:flex}
.sec-t{text-align:center;font-size:clamp(20px,4vw,26px);letter-spacing:.32em;margin:10px 0 2px;font-weight:700}
.sec-s{text-align:center;color:var(--paper-dim);font-size:12.5px;margin-bottom:8px;line-height:1.7}
.divider{width:110px;height:2px;background:linear-gradient(90deg,transparent,var(--naruto),transparent);margin:8px auto 14px}
.center{display:flex;flex-direction:column;align-items:center;gap:14px}
.btn{
  display:inline-block;background:linear-gradient(180deg,#d8402e,#a32619);color:#fff;
  border:none;cursor:pointer;padding:12px 36px;font-size:16px;letter-spacing:.22em;
  border-radius:4px;box-shadow:0 4px 0 #5e130b,0 6px 14px rgba(0,0,0,.5);
  transition:transform .08s,box-shadow .08s;font-weight:700;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5e130b}

.btn.ghost{background:linear-gradient(180deg,#3d3520,#28220f);box-shadow:0 4px 0 #14100a,0 6px 14px rgba(0,0,0,.5);color:var(--paper)}
.btn.blue{background:linear-gradient(180deg,#3f8fc0,#23618c);box-shadow:0 4px 0 #123349}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.small{padding:8px 18px;font-size:13px;letter-spacing:.12em}

/* ============ 标题 ============ */
#screen-title{justify-content:center;align-items:center;gap:0;
  background:
   radial-gradient(ellipse 70% 45% at 50% 18%, rgba(255,122,26,.13), transparent),
   radial-gradient(ellipse 90% 40% at 50% 110%, rgba(84,184,240,.08), transparent);
}
.uzu-wrap{position:relative;width:130px;height:130px;margin-bottom:18px}
.uzu{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 30%,rgba(255,122,26,.75) 42%,transparent 55%,transparent 60%,rgba(255,122,26,.35) 75%,transparent 88%);
  animation:spin 7s linear infinite;
  -webkit-mask:radial-gradient(circle,transparent 26%,#000 27%);mask:radial-gradient(circle,transparent 26%,#000 27%)}
.uzu.u2{animation-duration:11s;animation-direction:reverse;opacity:.5;inset:14px}
.uzu-core{position:absolute;inset:38px;border-radius:50%;border:3px solid var(--naruto);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 0 26px rgba(255,122,26,.5),inset 0 0 14px rgba(255,122,26,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
.title-main{font-size:clamp(46px,11vw,84px);letter-spacing:.14em;font-weight:900;
  background:linear-gradient(180deg,#fff3da 30%,#e8b06a 70%,#c97a2a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px rgba(255,122,26,.3));line-height:1.15}
.title-sub{color:var(--naruto);letter-spacing:.62em;margin:6px 0 26px;font-size:13px;text-indent:.62em}
.title-desc{color:var(--paper-dim);text-align:center;line-height:2;font-size:13.5px;max-width:430px;margin-bottom:30px}
.title-desc b{color:var(--paper)}
.char-grid{display:grid;grid-template-columns:repeat(3,minmax(0,170px));gap:12px;width:min(560px,100%);margin:0 auto 16px}
.char-card{min-height:190px;padding:12px;border-radius:6px;border:1px solid rgba(236,220,180,.22);
  background:linear-gradient(180deg,rgba(45,34,16,.92),rgba(18,13,6,.94));color:var(--paper);
  cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.38);text-align:center}
.char-card:hover{border-color:var(--naruto);box-shadow:0 0 18px rgba(255,122,26,.2),0 6px 18px rgba(0,0,0,.42)}
.char-face{font-size:38px;line-height:1;margin-bottom:8px}
.char-name{font-size:17px;font-weight:900;letter-spacing:.12em;margin-bottom:4px}
.char-role{font-size:12px;color:var(--gold);margin-bottom:8px}
.char-desc{font-size:11.5px;line-height:1.6;color:var(--paper-dim)}
.char-deck{font-size:11px;color:var(--chakra);margin-top:9px;line-height:1.5}

/* ============ 地图 ============ */
#map-wrap{max-width:540px;margin:0 auto;width:100%}
#map-svg{width:100%;display:block}
.mnode{cursor:default}
.mnode circle.bg{fill:#241c0e;stroke:rgba(236,220,180,.28);stroke-width:1.5}
.mnode text{fill:var(--paper);font-size:17px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mnode text.lbl{font-size:8.5px;fill:var(--paper-dim)}
.mnode.avail{cursor:pointer}
.mnode.avail circle.bg{stroke:var(--naruto);stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(255,122,26,.8))}
.mnode.avail circle.pulse{fill:none;stroke:var(--naruto);stroke-width:2;animation:mpulse 1.6s infinite}
@keyframes mpulse{0%{r:17;opacity:.9}100%{r:28;opacity:0}}
.mnode.done circle.bg{opacity:.35}.mnode.done text{opacity:.3}
.mnode.cur circle.bg{stroke:var(--chakra);stroke-width:2.5}
.medge{stroke:rgba(236,220,180,.22);stroke-width:2;stroke-dasharray:3 6;fill:none;stroke-linecap:round}
.medge.lit{stroke:rgba(255,122,26,.65)}
.act-banner{text-align:center;color:var(--gold);font-size:13px;letter-spacing:.3em;margin-bottom:2px}

/* ============ 战斗 ============ */
#screen-combat{padding:0;overflow:hidden}
#stage{--combat-side-w:clamp(260px,30vw,520px);flex:1;position:relative;display:flex;align-items:stretch;justify-content:center;min-height:230px;overflow:hidden;
  background-size:cover;background-position:center bottom;background-repeat:no-repeat}
#stage.act1{background-image:
  linear-gradient(180deg,rgba(2,5,8,.34),rgba(2,5,8,.04) 52%,rgba(0,0,0,.2)),
  url("assets/backgrounds/act1-forest.jpg")}
#stage.act2{background-image:
  linear-gradient(180deg,rgba(3,2,8,.38),rgba(3,2,8,.06) 54%,rgba(0,0,0,.24)),
  url("assets/backgrounds/act2-hideout.jpg")}
#stage.act3{background-image:
  linear-gradient(180deg,rgba(4,2,4,.36),rgba(4,2,4,.03) 55%,rgba(0,0,0,.24)),
  url("assets/backgrounds/act3-ruins.jpg")}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 6px)}
#stage.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}

#player-side{flex:0 1 var(--combat-side-w);min-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 4px 14px;z-index:2}
#enemy-side{flex:0 1 var(--combat-side-w);display:flex;align-items:flex-end;justify-content:space-evenly;padding:10px 8px 14px;flex-wrap:wrap;gap:4px;z-index:2}

.unit{display:flex;flex-direction:column;align-items:center;position:relative;transition:opacity .5s}
.unit.dead{opacity:0;pointer-events:none}
.unit .intent{font-size:13px;min-height:20px;margin-bottom:3px;color:var(--paper-dim);
  background:rgba(0,0,0,.45);padding:1px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.unit .intent b{color:#ff6b5b;font-size:14.5px}
.unit .intent .ib{color:var(--block)}
.frame{position:relative;display:flex;align-items:flex-end;justify-content:center;
  background:none;border:0;box-shadow:none;transition:transform .15s,filter .15s;overflow:visible}
.frame.sprite-frame{width:190px;height:250px}
.frame.emoji-frame{width:96px;height:96px;border-radius:50%;align-items:center;
  background:radial-gradient(circle at 38% 30%, var(--f1,#3a3322), var(--f2,#171208) 75%);
  border:2.5px solid var(--fc,#8a7c5a);
  box-shadow:0 6px 16px rgba(0,0,0,.55), inset 0 0 18px rgba(0,0,0,.5)}
.frame .face{font-size:50px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.frame .sprite{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;
  filter:drop-shadow(0 10px 8px rgba(0,0,0,.7))}
.frame.emoji-frame::before{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1.5px dashed color-mix(in srgb, var(--fc) 55%, transparent)}
.unit.player .frame.sprite-frame{width:205px;height:255px}
.unit.elite .frame.sprite-frame{width:210px;height:265px}
.unit.boss .frame.sprite-frame{width:250px;height:310px}
.unit.player .frame.emoji-frame{--fc:var(--naruto);--f1:#4a3014;--f2:#1c1006;box-shadow:0 6px 16px rgba(0,0,0,.55),0 0 22px rgba(255,122,26,.25)}
.unit.elite .frame.emoji-frame{--fc:var(--pwr);--f1:#33203f;--f2:#150c1a}
.unit.boss .frame.emoji-frame{--fc:var(--seal);width:118px;height:118px;--f1:#3f1820;--f2:#170709;
  box-shadow:0 6px 16px rgba(0,0,0,.6),0 0 30px rgba(192,48,34,.35)}
.unit.boss .frame .face{font-size:64px}
.unit.targetable .frame{cursor:pointer}
.unit.target-glow .frame{filter:drop-shadow(0 0 10px rgba(255,122,26,.95)) drop-shadow(0 0 22px rgba(255,122,26,.55));cursor:pointer;
  animation:tglow 1s infinite}
@keyframes tglow{50%{filter:drop-shadow(0 0 12px rgba(255,122,26,1)) drop-shadow(0 0 34px rgba(255,122,26,.8))}}
.unit.lunge .frame{animation:lunge .32s}
@keyframes lunge{30%{transform:translateX(26px) scale(1.05)}}
.unit.lunge-l .frame{animation:lungeL .32s}
@keyframes lungeL{30%{transform:translateX(-26px) scale(1.05)}}
.unit.hitfx .frame{animation:hitfx .3s}
@keyframes hitfx{20%{transform:translateX(-6px);filter:brightness(2) saturate(.4)}60%{transform:translateX(5px)}}
.uname{font-size:12.5px;margin-top:5px;letter-spacing:.05em}
.uname .ub{color:var(--block);font-size:12px}
.hpbar{width:104px;height:10px;background:#000;border-radius:6px;margin-top:4px;overflow:hidden;border:1px solid rgba(255,255,255,.18);position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#8c1f1f,#e04848);transition:width .3s;border-radius:6px}
.hpbar.pb i{background:linear-gradient(90deg,#1f6a8c,#54b8f0)}
.hptx{font-size:10.5px;color:var(--paper-dim);margin-top:2px}
.strow{display:flex;gap:4px;justify-content:center;margin-top:3px;flex-wrap:wrap;min-height:17px;max-width:150px}
.stag{font-size:10.5px;padding:0 5px;border-radius:3px;background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.22);cursor:pointer;white-space:nowrap}
.stag.buff{border-color:rgba(126,224,126,.5)}.stag.debuff{border-color:rgba(224,101,72,.6)}

.slashfx{position:absolute;width:90px;height:90px;pointer-events:none;z-index:30}
.slashfx::before,.slashfx::after{content:"";position:absolute;left:50%;top:50%;width:100px;height:3.5px;
  background:linear-gradient(90deg,transparent,#fff,#ffd9a0,transparent);border-radius:2px;
  transform-origin:center;animation:slash .28s forwards}
.slashfx::after{animation-delay:.07s;animation-name:slash2}
@keyframes slash{0%{transform:translate(-50%,-50%) rotate(40deg) scaleX(0);opacity:1}60%{transform:translate(-50%,-50%) rotate(40deg) scaleX(1.15)}100%{opacity:0;transform:translate(-50%,-50%) rotate(40deg) scaleX(1.2)}}
@keyframes slash2{0%{transform:translate(-50%,-50%) rotate(-35deg) scaleX(0);opacity:1}60%{transform:translate(-50%,-50%) rotate(-35deg) scaleX(1.1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-35deg) scaleX(1.15)}}
.blockfx{position:absolute;pointer-events:none;z-index:30;font-size:34px;animation:blockpop .5s forwards}
@keyframes blockpop{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}
.fdmg{position:absolute;font-weight:900;pointer-events:none;z-index:40;font-size:25px;color:#ff5b4a;
  text-shadow:0 0 6px #000,0 2px 3px #000;animation:fup .85s forwards}
.fdmg.blk{color:var(--block);font-size:19px}
.fdmg.heal{color:#7ee07e}
@keyframes fup{15%{transform:translateY(-8px) scale(1.25)}100%{transform:translateY(-52px) scale(1);opacity:0}}

#turn-banner{position:absolute;top:38%;left:0;right:0;text-align:center;z-index:45;pointer-events:none;
  font-size:30px;letter-spacing:.5em;font-weight:900;color:var(--paper);opacity:0;text-indent:.5em;
  text-shadow:0 0 18px rgba(255,122,26,.8),0 2px 6px #000}
#turn-banner.go{animation:banner 1.1s forwards}
@keyframes banner{0%{opacity:0;transform:scale(1.3)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}

#combat-bottom{background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.6));border-top:1px solid rgba(236,220,180,.12)}
#combat-info{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;font-size:12px;color:var(--paper-dim)}
.pilebtn{background:rgba(255,255,255,.05);border:1px solid rgba(236,220,180,.2);color:var(--paper-dim);
  border-radius:4px;padding:3px 10px;font-size:11.5px;cursor:pointer}
#hand-outer{display:flex;align-items:center;gap:8px;padding:4px 10px 12px}
#orb{width:58px;height:58px;min-width:58px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 36% 28%,#8fd4f7,#1d5a80 72%);
  border:2px solid var(--chakra);color:#fff;font-weight:900;font-size:21px;
  box-shadow:0 0 16px rgba(84,184,240,.55),inset 0 -4px 8px rgba(0,0,0,.3)}
#orb small{font-size:8.5px;font-weight:400;opacity:.9;letter-spacing:.1em}
#orb.zero{filter:grayscale(.8);box-shadow:none}
#hand{flex:1;position:relative;height:calc(var(--card-h) + 24px)}
#endturn{min-width:74px;padding:12px 10px;font-size:14px;letter-spacing:.1em;border-radius:6px}
#endturn.enemyturn{filter:grayscale(1);pointer-events:none}

/* 卡牌 */
.card{width:var(--card-w);height:var(--card-h);border-radius:10px;position:absolute;cursor:pointer;
  background:linear-gradient(168deg,#2e2615 0%,#1b1509 70%);
  border:2px solid var(--cc,#777);
  box-shadow:0 4px 10px rgba(0,0,0,.55);
  display:flex;flex-direction:column;padding:6px 7px 5px;
  transition:transform .16s,box-shadow .16s,left .25s;
  transform-origin:bottom center}
.card.inhand:hover{z-index:30!important}
.card .gem{position:absolute;top:-7px;left:-7px;width:25px;height:25px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 35% 30%,#8fd4f7,#1d5a80);
  border:1.5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
.card.noafford .gem{background:radial-gradient(circle at 35% 30%,#e08585,#7a1d1d)}
.card.noafford{opacity:.62}
.card .nm{font-size:12px;font-weight:800;text-align:center;color:#f4e8c5;line-height:1.05;min-height:18px;
  padding:0 13px 2px;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .art{height:var(--card-art-h);display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden;
  background:radial-gradient(ellipse at center, color-mix(in srgb,var(--cc) 22%,transparent), rgba(0,0,0,.22) 78%);
  margin:1px 0 3px;border:1px solid rgba(236,220,180,.18);border-radius:5px;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .tband{align-self:center;font-size:7.6px;text-align:center;color:var(--paper);letter-spacing:.18em;
  border:1px solid rgba(236,220,180,.2);border-radius:999px;padding:1px 9px;margin-bottom:2px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 34%,#1b1509),#21190d)}
.card .ds{font-size:10.4px;text-align:left;flex:1;display:block;
  line-height:1.36;color:var(--paper);font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  padding:4px 5px 1px;overflow:hidden;writing-mode:horizontal-tb;text-orientation:mixed;
  word-break:normal;overflow-wrap:break-word;line-break:strict}
.card .ds.middesc{font-size:9.8px;line-height:1.3}
.card .ds.longdesc{font-size:9.2px;line-height:1.24;padding-top:3px}
.card .ds b{color:var(--naruto);font-size:1em;line-height:inherit;font-weight:900;vertical-align:baseline}
.card .rar{min-height:10px;align-self:flex-end;font-size:8px;color:var(--gold);letter-spacing:.1em;line-height:1}
.card.atk{--cc:var(--atk)}.card.skl{--cc:var(--skl)}.card.pwr{--cc:var(--pwr)}.card.curse{--cc:var(--curse)}
.card.upg .nm{color:#8ee08e}
.card.r2{box-shadow:0 4px 10px rgba(0,0,0,.55),0 0 11px rgba(224,168,62,.3)}
.card.r3{box-shadow:0 4px 10px rgba(0,0,0,.55),0 0 14px rgba(168,127,214,.5)}
.card.picked{transform:translateY(-34px) scale(1.12)!important;z-index:40!important;
  box-shadow:0 14px 28px rgba(0,0,0,.7),0 0 18px color-mix(in srgb,var(--cc) 60%,transparent)}
.card.static{position:static;cursor:pointer}
.card.playing{animation:playcard .3s forwards}
@keyframes playcard{to{transform:translateY(-130px) scale(.7);opacity:0}}

#target-hint{position:absolute;top:8px;left:0;right:0;text-align:center;z-index:44;pointer-events:none;
  color:var(--naruto);font-size:13.5px;letter-spacing:.2em;opacity:0;transition:opacity .2s;
  text-shadow:0 0 8px #000}
#target-hint.on{opacity:1}

/* ============ 网格/弹层/通用列表 ============ */
.cgrid{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;margin:12px 0;padding-bottom:6px}
.ritem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid rgba(236,220,180,.22);
  padding:13px 20px;border-radius:7px;cursor:pointer;min-width:270px;max-width:420px;justify-content:center;
  font-size:14.5px;transition:border-color .15s;text-align:center;line-height:1.5}
.ritem:active,.ritem:hover{border-color:var(--naruto)}
.ritem.noclick{pointer-events:none}
#overlay{position:absolute;inset:0;background:rgba(5,3,0,.88);z-index:60;display:none;
  flex-direction:column;align-items:center;padding:18px;overflow-y:auto}
#overlay.on{display:flex}
#toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:90;
  background:rgba(0,0,0,.92);border:1px solid var(--naruto);color:var(--paper);
  padding:8px 20px;border-radius:5px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;
  max-width:88%;text-align:center;line-height:1.5}
#toast.show{opacity:1}
.shop-relic{width:138px;background:var(--panel);border:1px solid var(--gold);border-radius:9px;
  padding:13px 9px;text-align:center;cursor:pointer}
.shop-relic .ric{font-size:32px}
.shop-relic .rname{font-size:13px;color:var(--gold);margin:5px 0 4px}
.shop-relic .rdesc{font-size:10.5px;color:var(--paper-dim);line-height:1.45;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.price{text-align:center;color:var(--gold);font-size:13.5px;margin-top:6px}
.price.cant{color:#8a5a5a}
.sold{opacity:.3;pointer-events:none}
.event-box{max-width:520px;margin:14px auto;background:var(--panel);border:1px solid rgba(236,220,180,.25);
  border-radius:10px;padding:24px 22px;text-align:center;width:100%}
.event-box .eic{font-size:52px}
.event-box p{margin:13px 0;line-height:1.85;font-size:14.5px}
.eopts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.eopts .btn{letter-spacing:.05em;font-size:14px;padding:12px 16px}
.statline{display:flex;gap:22px;justify-content:center;color:var(--paper-dim);font-size:13px;flex-wrap:wrap}
.statline b{color:var(--paper)}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
@media (max-width:620px){
  :root{--card-w:120px;--card-h:176px;--card-art-h:68px}
  #stage{--combat-side-w:50%}
  #screen-title{justify-content:flex-start;padding-top:22px}
  .char-grid{grid-template-columns:1fr;max-width:340px}
  .char-card{min-height:150px}
  .card .nm{min-height:16px;padding-left:11px;padding-right:11px}
  .card .tband{font-size:7px;padding:1px 8px}
  .card .ds{font-size:9px;line-height:1.2}
  .card .ds.middesc{font-size:8.5px;line-height:1.16}
  .card .ds.longdesc{font-size:8px;line-height:1.12}
  .card .ds b{font-size:1em}
  .frame.sprite-frame{width:118px;height:154px}.frame .face{font-size:42px}
  .frame.emoji-frame{width:82px;height:82px}
  .unit.player .frame.sprite-frame{width:128px;height:160px}
  .unit.elite .frame.sprite-frame{width:130px;height:166px}
  .unit.boss .frame.sprite-frame{width:150px;height:190px}.unit.boss .frame .face{font-size:54px}
  .unit.boss .frame.emoji-frame{width:100px;height:100px}
  #player-side{min-width:120px}
  #hand{height:calc(var(--card-h) + 18px)}
}
</style>

   ]},
];
</script>
<script>
/* ====================== 工具 & 音效 ====================== */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function toast(m){const t=$('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1900)}
function esc(s){return String(s).replace(/"/g,'&quot;')}

const SFX={
  on:true,ctx:null,
  ac(){if(!this.ctx)try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){this.on=false}return this.ctx},
  tone(f,dur,type='sine',vol=.18,slide=0,delay=0){
    if(!this.on||!this.ac())return;const c=this.ctx,t=c.currentTime+delay;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)},
  noise(dur=.12,vol=.14,delay=0){
    if(!this.on||!this.ac())return;const c=this.ctx,t=c.currentTime+delay;
    const len=c.sampleRate*dur,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource();s.buffer=buf;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;
    const g=c.createGain();g.gain.value=vol;
    s.connect(f);f.connect(g);g.connect(c.destination);s.start(t)},
  card(){this.noise(.09,.08);this.tone(700,.08,'sine',.05,300)},
  atk(){this.noise(.13,.18);this.tone(160,.12,'square',.1,-80)},
  blk(){this.tone(120,.16,'sine',.2,-40);this.noise(.05,.05)},
  heal(){this.tone(520,.15,'sine',.12);this.tone(780,.2,'sine',.1,.0,.1)},
  gold(){this.tone(1180,.1,'square',.06);this.tone(1560,.14,'square',.05,0,.07)},
  hurt(){this.tone(110,.25,'sawtooth',.16,-50);this.noise(.16,.14)},
  turn(){this.tone(220,.2,'sine',.14,-60);this.noise(.08,.06)},
  win(){[523,659,784,1046].forEach((f,i)=>this.tone(f,.22,'square',.07,0,i*.12))},
  lose(){[330,277,233,175].forEach((f,i)=>this.tone(f,.3,'sawtooth',.09,0,i*.16))},
  potion(){this.tone(880,.12,'sine',.1,200)},
};
function mkCard(key,upgraded=false){
  const b=CARDS[key];
  const c={key,n:b.n,t:b.t,c:b.c,r:b.r,ic:b.ic,d:b.d,upgraded:false,
    art:b.art||"",
    dmg:b.dmg||0,hits:b.hits||1,blk:b.blk||0,draw:b.draw||0,vuln:b.vuln||0,tvuln:b.tvuln||0,
    weak:b.weak||0,tweak:b.tweak||0,clone:b.clone||0,aoe:b.aoe||0,self:b.self||0,heal:b.heal||0,
    str:b.str||0,dex:b.dex||0,nindo:b.nindo||0,ramp:b.ramp||0,energy:b.energy||0,cleanse:b.cleanse||0,
    all:b.all||0,ex:b.ex||0,unplayable:b.unplayable||0};
  if(upgraded)upgradeCard(c);return c;
}
function upgradeCard(c){
  if(c.upgraded)return;
  const up=CARDS[c.key].up||{};Object.assign(c,up);c.upgraded=true;
  c.n=(up.n||CARDS[c.key].n)+"⁺";
}
function cardNameSize(name){
  const len=[...String(name).replace(/[⁺+]/g,'')].length;
  if(len<=4)return 13;
  if(len<=6)return 12;
  if(len<=7)return 11;
  if(len<=9)return 10;
  return 9.5;
}
function cardDescClass(desc){
  const len=String(desc).replace(/<[^>]+>/g,'').replace(/[，。,.、\s]/g,'').length;
  if(len>30)return ' longdesc';
  if(len>22)return ' middesc';
  return '';
}
function cardHTML(c,extra="",style=""){
  const desc=(window.G&&G.cardDesc)?G.cardDesc(c):c.d;
  const art=c.art?`<img src="${esc(c.art)}" alt="">`:c.ic;
  return `<div oncontextmenu="event.preventDefault();event.stopPropagation();G.previewUpgrade('${c.key}',${c.upgraded?1:0});return false" class="card ${c.t} r${c.r} ${c.upgraded?'upg':''} ${extra}" style="${style}">
    <div class="gem">${c.unplayable?'✕':c.c}</div>
    <div class="nm" style="font-size:${cardNameSize(c.n)}px">${c.n}</div>
    <div class="art">${art}</div>
    <div class="tband">${TYPE_LABEL[c.t]}</div>
    <div class="ds${cardDescClass(desc)}">${desc}</div>
    ${RAR_LABEL[c.r]?`<div class="rar">◆ ${RAR_LABEL[c.r]}</div>`:''}
  </div>`;
}
function unitPortrait(icon,sprite,name=""){
  return sprite?`<img class="sprite" src="${esc(sprite)}" alt="${esc(name)}">`:`<div class="face">${icon}</div>`;
}
function unitFrame(icon,sprite,name=""){
  return `<div class="frame ${sprite?'sprite-frame':'emoji-frame'}">${unitPortrait(icon,sprite,name)}</div>`;
}

/* ====================== 游戏主体 ====================== */
const G={
  sfxOn:true,
  toggleSfx(){SFX.on=!SFX.on;$('sfx-btn').textContent=SFX.on?'🔊':'🔇';},
  char(){return CHARACTERS[this.character]||CHARACTERS.naruto},
  cardAllowed(k){
    const ch=CARDS[k]&&CARDS[k].chars;
    return !ch||ch.includes(this.character||'naruto');
  },
  potionAllowed(k){
    const ch=POTIONS[k]&&POTIONS[k].chars;
    return !ch||ch.includes(this.character||'naruto');
  },
  randomPotionKey(excludeKeys=[]){
    const exclude=new Set(excludeKeys);
    const pool=Object.keys(POTIONS).filter(k=>!exclude.has(k)&&this.potionAllowed(k));
    return pick(pool);
  },
  characterEventCard(kind){
    return CHARACTER_EVENT_CARDS[kind][this.character]||CHARACTER_EVENT_CARDS[kind].naruto;
  },

  /* ---------- 新开局 ---------- */
  newRun(charKey=null){
    SFX.ac();
    this.character=CHARACTERS[charKey]?charKey:(this.character||'naruto');
    const C=this.char();
    this._ended=false;this.combatEnded=false;
    this.maxHp=C.hp;this.hp=C.hp;this.gold=C.gold;
    this.act=0;this.row=0;this.curCol=-1;
    this.relics=[];this.potions=['heisyo'];this.pendingRemove=false;
    this.stats={dmg:0,kills:0,cards:0,turns:0,elites:0};
    this.permStr=0;
    this.deck=C.deck.map(k=>mkCard(k));
    this.startAct(0);
  },
  startAct(a){
    this.act=a;this.row=0;this.curCol=-1;
    this.genMap();
    $('topbar').classList.add('on');
    this.updateTopbar();this.renderMap();show('screen-map');
  },
  floorLabel(){return `${this.act+1}-${this.row}`},
  heal(n){if(n<=0)return;this.hp=Math.min(this.maxHp,this.hp+n);SFX.heal();this.updateTopbar()},
  eventDamage(n){
    if(this.hasRelic('sakeflask'))n=Math.floor(n/2);
    this.hp-=n;SFX.hurt();this.updateTopbar();
    if(this.hp<=0)this.gameOver();
  },
  hasRelic(k){return this.relics.includes(k)},
  addRelic(k){
    this.relics.push(k);
    if(k==='necklace'){this.maxHp+=10;this.hp=Math.min(this.maxHp,this.hp+10)}
    if(k==='headband')this.permStr+=1;
    if(k==='sage_cloak'){this.maxHp+=18;this.hp+=18}
    if(k==='kyuubi_seal'){this.maxHp-=8;this.hp=Math.min(this.hp,this.maxHp)}
    if(k==='forbidden_scroll'){this.maxHp-=10;this.hp=Math.min(this.hp,this.maxHp)}
    if(k==='hokage_cloak'){this.maxHp+=12;this.hp+=12}
    if(k==='scrollcase'){
      const up=this.deck.filter(c=>!c.upgraded&&c.t!=='curse');
      if(up.length)upgradeCard(pick(up));
    }
    this.updateTopbar();
  },
  relicData(k){return RELICS[k]||BOSS_RELICS[k]},
  randomRelic(){const p=Object.keys(RELICS).filter(k=>!this.hasRelic(k));return p.length?pick(p):null},
  randomRelics(count){
    const p=shuffle(Object.keys(RELICS).filter(k=>!this.hasRelic(k)));
    return p.slice(0,count);
  },
  randomBossRelics(count){
    const p=shuffle(Object.keys(BOSS_RELICS).filter(k=>!this.hasRelic(k)));
    return p.slice(0,count);
  },
  randomCard(minR=1,excludeKeys=[]){
    let tier;
    if(minR===1){const r=Math.random();tier=r<.62?1:(r<.92?2:3)}
    else if(minR===2){const r=Math.random();tier=r<.7?2:3}
    else tier=3;
    const exclude=new Set(excludeKeys);
    return this.randomCardOfTier(tier,exclude,minR);
  },
  randomCardOfTier(tier,excludeKeys=[],minR=1){
    const exclude=new Set(excludeKeys);
    let pool=Object.keys(CARDS).filter(k=>CARDS[k].r===tier&&!exclude.has(k)&&this.cardAllowed(k));
    if(!pool.length)pool=Object.keys(CARDS).filter(k=>CARDS[k].r>=minR&&CARDS[k].r<=3&&!exclude.has(k)&&this.cardAllowed(k));
    if(!pool.length)pool=Object.keys(CARDS).filter(k=>CARDS[k].r===tier&&this.cardAllowed(k));
    if(!pool.length)pool=Object.keys(CARDS).filter(k=>CARDS[k].r>=1&&CARDS[k].r<=3&&this.cardAllowed(k));
    return mkCard(pick(pool));
  },
  randomCards(count,minR=1){
    const used=new Set(),cards=[];
    for(let i=0;i<count;i++){
      const c=this.randomCard(minR,used);
      cards.push(c);used.add(c.key);
    }
    return cards;
  },
  maybeUpgradeRewardCard(c,chance){
    if(c&&!c.upgraded&&c.t!=='curse'&&Math.random()<chance)upgradeCard(c);
    return c;
  },
  rewardUpgradeChance(kind){
    return kind==='fight'?0.03:0.05;
  },
  randomCardsByTiers(tiers,upgradeChance=0){
    const used=new Set(),cards=[];
    tiers.forEach(t=>{
      const c=this.randomCardOfTier(t,used,1);
      cards.push(this.maybeUpgradeRewardCard(c,upgradeChance));used.add(c.key);
    });
    return cards;
  },
  combatRewardTiers(kind){
    if(kind==='elite'){
      const tiers=[0,0,0].map(()=>Math.random()<0.15?3:2);
      return shuffle(tiers);
    }
    return [0,0,0].map(()=>{
      const r=Math.random();
      return r<0.82?1:(r<0.98?2:3);
    });
  },
  combatRewardCards(kind){
    return this.randomCardsByTiers(this.combatRewardTiers(kind),this.rewardUpgradeChance(kind));
  },
  addPotion(k){
    if(this.potions.length>=2){toast('秘药栏已满(最多 2 瓶)');return false}
    this.potions.push(k);this.updateTopbar();return true;
  },
  updateTopbar(){
    $('t-char').textContent=`${this.char().face} ${this.char().n}`;
    $('t-hp').textContent=`${this.hp}/${this.maxHp}`;
    $('t-gold').textContent=this.gold;
    $('t-floor').textContent=`📍 ${ACTS[this.act].name.slice(0,3)} · ${this.row}/${(this.mapRows||7)+1} 层`;
    $('t-deck').textContent=this.deck.length;
    $('relicbar').innerHTML=this.relics.map(k=>{const r=this.relicData(k);
      return `<div class="relic-i" onclick="toast('<b>${esc(r.n)}</b><br>${esc(r.d)}')">${r.ic}</div>`}).join('');
    let ph='';
    for(let i=0;i<2;i++){
      const k=this.potions[i];
      ph+=k?`<div class="potion-i" onclick="G.potionMenu(${i})">${POTIONS[k].ic}</div>`
          :`<div class="potion-i empty">·</div>`;
    }
    $('potionbar').innerHTML=ph;
  },
  potionMenu(i){
    const k=this.potions[i];if(!k)return;
    const p=POTIONS[k];
    const inCombat=$('screen-combat').classList.contains('active')&&this.enemies&&this.enemies.some(e=>e.hp>0);
    const ov=$('overlay');
    ov.innerHTML=`<div style="margin:auto;text-align:center" class="center">
      <div style="font-size:54px">${p.ic}</div>
      <div class="sec-t" style="font-size:20px;letter-spacing:.15em">${p.n}</div>
      <div class="sec-s">${p.d}</div>
      ${inCombat?`<button class="btn" onclick="G.usePotion(${i})">使 用</button>`:
        `<div class="sec-s">只能在战斗中使用</div>`}
      <button class="btn ghost small" onclick="G.discardPotion(${i})">丢弃</button>
      <button class="btn ghost small" onclick="G.closeOverlay()">返回</button>
    </div>`;
    ov.classList.add('on');
  },
  discardPotion(i){this.potions.splice(i,1);this.updateTopbar();this.closeOverlay()},
  usePotion(i){
    const k=this.potions[i];if(!k)return;
    this.potions.splice(i,1);this.closeOverlay();SFX.potion();
    if(k==='heisyo')this.heal(12);
    if(k==='smokeball'){this.block+=10;this.fxText(this.playerEl(),'+10','blk')}
    if(k==='bakukunai'){this.enemies.filter(e=>e.hp>0).forEach(e=>this.dealDamage(e,9,true));if(this.checkWin())return}
    if(k==='chakrapill')this.energy+=2;
    if(k==='antidote'){this.poison=0;this.weak=0;this.vuln=0}
    if(k==='strpill')this.str+=2;
    if(k==='clonepill')this.clones+=2;
    if(k==='foxpill'){this.str+=1;this.rampStr=(this.rampStr||0)+1}
    if(k==='toadoil'){this.dex+=1;this.clones+=2}
    if(k==='sealpaper')this.enemies.filter(e=>e.hp>0).forEach(e=>{e.weak+=2;e.vuln+=2});
    if(k==='dexpill')this.dex+=2;
    if(k==='lightningpill'){this.energy+=1;this.enemies.filter(e=>e.hp>0).forEach(e=>e.vuln+=1)}
    if(k==='eyedrops'){this.str+=1;this.enemies.filter(e=>e.hp>0).forEach(e=>{e.weak+=1;e.vuln+=1})}
    if(k==='fireseal'){this.enemies.filter(e=>e.hp>0).forEach(e=>this.dealDamage(e,14,true));if(this.checkWin())return}
    if(k==='medspray'){this.heal(10);this.poison=0;this.weak=0;this.vuln=0}
    if(k==='mightpill'){this.str+=2;this.block+=6;this.fxText(this.playerEl(),'+6','blk')}
    if(k==='slugfluid'){this.heal(6);this.block+=10;this.fxText(this.playerEl(),'+10','blk')}
    this.updateTopbar();this.renderCombat();
  },

  /* ---------- StS式路线图 ---------- */
  genMap(){
    const C=MAP_RULES,ROWS=C.rows,COLS=C.cols,PATHS=C.paths;
    const nodes={};   // "r-c" -> {r,c,t,edges:Set}
    const key=(r,c)=>r+'-'+c;
    for(let p=0;p<PATHS;p++){
      let c=rnd(0,COLS-1);
      let prev=null;
      for(let r=1;r<=ROWS;r++){
        if(r>1)c=Math.max(0,Math.min(COLS-1,c+rnd(-1,1)));
        const k=key(r,c);
        if(!nodes[k])nodes[k]={r,c,t:null,edges:new Set(),from:new Set()};
        if(prev&&prev!==k){nodes[prev].edges.add(k);nodes[k].from.add(prev)}
        prev=k;
      }
      nodes[prev].edges.add('boss');
    }
    nodes['boss']={r:ROWS+1,c:(COLS-1)/2,t:'boss',edges:new Set(),from:new Set()};
    const starts=Object.keys(nodes).filter(k=>nodes[k].r===1);
    const routes=[];
    const walk=(k,path=[])=>{
      const p=path.concat(k);
      if(k==='boss'){routes.push(p);return}
      nodes[k].edges.forEach(nk=>walk(nk,p));
    };
    starts.forEach(k=>walk(k));
    const chestRow=rnd(4,ROWS-2);
    let restRow=rnd(C.guaranteedRestFrom,Math.min(C.guaranteedRestTo,ROWS-1));
    while(restRow===chestRow)restRow=rnd(C.guaranteedRestFrom,Math.min(C.guaranteedRestTo,ROWS-1));
    const routeCount=(route,t)=>route.filter(k=>nodes[k]&&nodes[k].t===t).length;
    const routesWith=k=>routes.filter(r=>r.includes(k));
    const hasIncomingType=(n,t)=>[...n.from].some(k=>nodes[k]&&nodes[k].t===t);
    const hasNeighborType=(n,t)=>hasIncomingType(n,t)||[...n.edges].some(k=>nodes[k]&&nodes[k].t===t);
    const weightedType=()=>{
      const entries=Object.entries(C.weights),sum=entries.reduce((s,[,w])=>s+w,0);
      let r=Math.random()*sum;
      for(const [t,w] of entries){r-=w;if(r<=0)return t}
      return 'fight';
    };
    const canUse=(k,t)=>{
      const n=nodes[k];
      if(t==='elite'&&n.r<=C.noEliteBefore)return false;
      if(t==='rest'&&(n.r===chestRow||n.r===restRow-1||n.r===restRow+1))return false;
      if(t==='rest'&&hasIncomingType(n,'rest'))return false;
      if(t==='elite'&&routesWith(k).some(r=>routeCount(r,'elite')>=C.maxElitePerRoute))return false;
      if(t==='unknown'&&routesWith(k).some(r=>routeCount(r,'unknown')>=C.maxUnknownPerRoute))return false;
      return true;
    };
    for(let r=1;r<=ROWS;r++){
      const row=Object.entries(nodes).filter(([,n])=>n.r===r);
      row.forEach(([k,n])=>{
        if(r===1){n.t='fight';return}
        if(r===chestRow){n.t='chest';return}
        if(r===restRow){n.t='rest';return}
        const first=weightedType();
        const choices=[first,'fight','unknown','shop','rest','elite'];
        n.t=choices.find(t=>canUse(k,t))||'fight';
      });
      if(r!==chestRow&&r!==restRow&&!row.some(([,n])=>n.t==='fight'||n.t==='elite')){
        const f=row.find(([k])=>canUse(k,'fight'));
        if(f)f[1].t='fight';
      }
    }
    if(!Object.values(nodes).some(n=>n.t==='rest')){
      const restSpot=shuffle(Object.entries(nodes).filter(([k,n])=>k!=='boss'&&n.r>2&&n.r!==chestRow&&!hasNeighborType(n,'rest')))[0];
      if(restSpot)restSpot[1].t='rest';
    }
    this.mapRows=ROWS;this.mapChestRow=chestRow;this.mapRestRow=restRow;this.mapRoutes=routes;
    this.nodes=nodes;
  },
  renderMap(){
    $('act-banner').textContent=`— ${ACTS[this.act].name} —`;
    $('map-title').textContent=ACTS[this.act].sub;
    const ICON={fight:'⚔️',elite:'💀',rest:'🔥',unknown:'❓',event:'❓',shop:'🏪',chest:'🎁',boss:'☠️'};
    const LBL={fight:'战斗',elite:'精英',rest:'篝火',unknown:'未知',event:'奇遇',shop:'商店',chest:'宝箱',boss:'首领'};
    const W=500,ROWH=86,PAD=46;
    const rows=this.mapRows||7;
    const cols=MAP_RULES.cols||5;
    const H=PAD*2+(rows+1)*ROWH;
    const X=c=>60+c*((W-120)/(cols-1));
    const Y=r=>H-PAD-(r-1)*ROWH;
    const cur=this.curCol>=0?this.nodes[this.row+'-'+this.curCol]:null;
    const avail=new Set();
    if(!cur){Object.values(this.nodes).forEach(n=>{if(n.r===1)avail.add(n.r+'-'+n.c)})}
    else cur.edges.forEach(k=>avail.add(k));
    let edges='',nds='';
    Object.entries(this.nodes).forEach(([k,n])=>{
      n.edges.forEach(k2=>{
        const m=this.nodes[k2];
        const lit=(cur&&k===this.row+'-'+this.curCol&&avail.has(k2));
        edges+=`<path class="medge ${lit?'lit':''}" d="M${X(n.c)} ${Y(n.r)-0} L${X(m.c)} ${Y(m.r)}"/>`;
      });
    });
    Object.entries(this.nodes).forEach(([k,n])=>{
      const isCur=cur&&k===this.row+'-'+this.curCol;
      const isAvail=avail.has(k);
      const isDone=n.r<this.row||(n.r===this.row&&!isCur);
      const R=n.t==='boss'?26:18;
      const cls=`mnode ${isAvail?'avail':''} ${isCur?'cur':''} ${isDone&&!isAvail?'done':''}`;
      const click=isAvail?`onclick="G.enterNode('${k}')"`:'';
      nds+=`<g class="${cls}" ${click}>
        ${isAvail?`<circle class="pulse" cx="${X(n.c)}" cy="${Y(n.r)}" r="${R}"/>`:''}
        <circle class="bg" cx="${X(n.c)}" cy="${Y(n.r)}" r="${R}"/>
        <text x="${X(n.c)}" y="${Y(n.r)-2}">${ICON[n.t]}</text>
        <text class="lbl" x="${X(n.c)}" y="${Y(n.r)+R+9}">${LBL[n.t]}</text>
      </g>`;
    });
    $('map-wrap').innerHTML=`<svg id="map-svg" viewBox="0 0 ${W} ${H}">${edges}${nds}</svg>`;
    // 自动滚到当前位置附近
    const sc=$('screen-map');
    requestAnimationFrame(()=>{sc.scrollTop=sc.scrollHeight*(1-(this.row+1.6)/(rows+2))});
  },
  resolveUnknown(n){
    const r=Math.random(),U=MAP_RULES.unknown;
    let t='event';
    if(r<U.event)t='event';
    else if(r<U.event+U.fight)t='fight';
    else if(r<U.event+U.fight+U.shop)t='shop';
    else t='chest';
    n.t=t;n.revealed=true;
    return t;
  },
  enterNode(k){
    const n=this.nodes[k];if(!n)return;
    this.row=n.r;this.curCol=n.c;
    this.updateTopbar();SFX.card();
    const t=n.t==='unknown'?this.resolveUnknown(n):n.t;
    if(t==='fight')this.startCombat('fight');
    else if(t==='elite')this.startCombat('elite');
    else if(t==='boss')this.startCombat('boss');
    else if(t==='rest')this.openRest();
    else if(t==='shop')this.openShop();
    else if(t==='event')this.openEvent();
    else if(t==='chest')this.openChest();
  },
  backToMap(){
    this.updateTopbar();this.renderMap();show('screen-map');
  },

  /* ---------- 牌堆/卡组查看 ---------- */
  viewDeck(){this.viewCards('我的卡组',this.deck)},
  viewPile(which){
    if(which==='draw')this.viewCards('抽牌堆(顺序已隐藏)',shuffle([...this.drawPile]));
    else this.viewCards('弃牌堆',this.discardPile);
  },
  viewCards(title,cards){
    const ov=$('overlay');
    ov.innerHTML=`<div class="sec-t" style="font-size:19px">${title} · ${cards.length} 张</div><div class="divider"></div>
      <div class="cgrid">${cards.map(c=>`<div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(c,'static')}</div>`).join('')||'<div class="sec-s">(空)</div>'}</div>
      <button class="btn ghost" onclick="G.closeOverlay()">关 闭</button>`;
    ov.classList.add('on');
  },
  pickFromDeck(title,filter,onPick,allowCancel=true,onEmpty=null){
    const list=this.deck.map((c,i)=>({c,i})).filter(x=>filter(x.c));
    if(!list.length){toast('没有符合条件的卡牌');return onEmpty?onEmpty():undefined}
    const ov=$('overlay');
    ov.innerHTML=`<div class="sec-t" style="font-size:19px">${title}</div><div class="divider"></div>
      <div class="cgrid">${list.map(x=>`<div style="position:relative;width:var(--card-w);height:var(--card-h)" onclick="G._dp(${x.i})">${cardHTML(x.c,'static')}</div>`).join('')}</div>
      ${allowCancel?'<button class="btn ghost" onclick="G.closeOverlay()">返 回</button>':''}`;
    this._onDp=onPick;ov.classList.add('on');
  },
  _dp(i){const c=this.deck[i];this.closeOverlay();this._onDp(c,i)},
  previewUpgrade(key,isUpgraded=false){
    const base=CARDS[key];if(!base)return;
    const canUp=base.up&&Object.keys(base.up).length;
    const ov=$('overlay');
    if(!this._previewReturnOverlay)this._previewReturnOverlay=ov.classList.contains('on')?{html:ov.innerHTML}:null;
    if(!canUp){
      ov.innerHTML=`<div class="center">
        <div class="sec-t" style="font-size:19px">升级预览</div><div class="divider"></div>
        <div class="sec-s">这张卡没有可预览的升级效果。</div>
        <div style="position:relative;width:var(--card-w);height:var(--card-h);margin:0 auto">${cardHTML(mkCard(key,!!isUpgraded),'static')}</div>
        <button class="btn ghost" onclick="G.closeUpgradePreview()">关 闭</button></div>`;
    }else if(isUpgraded){
      ov.innerHTML=`<div class="center">
        <div class="sec-t" style="font-size:19px">已升级效果</div><div class="divider"></div>
        <div style="position:relative;width:var(--card-w);height:var(--card-h);margin:0 auto">${cardHTML(mkCard(key,true),'static')}</div>
        <button class="btn ghost" onclick="G.closeUpgradePreview()">关 闭</button></div>`;
    }else{
      ov.innerHTML=`<div class="center">
        <div class="sec-t" style="font-size:19px">升级预览</div><div class="divider"></div>
        <div class="cgrid">
          <div><div class="sec-s">当前</div><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(mkCard(key,false),'static')}</div></div>
          <div><div class="sec-s">升级后</div><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(mkCard(key,true),'static')}</div></div>
        </div>
        <button class="btn ghost" onclick="G.closeUpgradePreview()">关 闭</button></div>`;
    }
    ov.classList.add('on');
  },
  closeUpgradePreview(){
    const ov=$('overlay'),ret=this._previewReturnOverlay;
    this._previewReturnOverlay=null;
    if(ret&&ret.html){ov.innerHTML=ret.html;ov.classList.add('on');return}
    this.closeOverlay();
  },
  closeOverlay(){this._previewReturnOverlay=null;$('overlay').classList.remove('on');$('overlay').innerHTML=''},
};
</script>
<script>
/* ====================== 战斗系统 ====================== */
Object.assign(G,{
  startCombat(kind){
    this.combatKind=kind;
    const A=ACTS[this.act];
    const mk=key=>{
      const d=ENEMIES[key];
      const e={key,n:d.n,sp:d.sp,sprite:d.sprite||"",maxHp:rnd(d.hp[0],d.hp[1]),
        moves:d.moves,special:d.special||null,phase2:d.phase2||null,phase2done:false,
        regen:d.regen||0,grow:d.grow||null,
        mi:rnd(0,d.moves.length-1),tc:0,block:0,str:0,weak:0,vuln:0,
        elite:d.elite||0,boss:d.boss||0};
      e.hp=e.maxHp;return e;
    };
    if(kind==='boss')this.enemies=A.boss.map(mk);
    else if(kind==='elite')this.enemies=pick(A.elites).map(mk);
    else{
      const dbl=this.row>=3&&Math.random()<0.45;
      this.enemies=[mk(pick(A.pool))];
      if(dbl)this.enemies.push(mk(pick(A.pool)));
      const bonus=Math.floor(this.row*0.9)+(this.act*5);
      this.enemies.forEach(e=>{e.maxHp+=bonus;e.hp+=bonus});
    }
    // 玩家战斗态
    this.block=0;this.str=this.permStr;this.dex=0;this.weak=0;this.vuln=0;this.poison=0;
    this.clones=this.hasRelic('contract')?2:0;
    this.nindoBlk=0;this.rampStr=0;
    this.turn=0;this.picked=null;this.busy=false;this.combatEnded=false;
    this.drawPile=shuffle(this.deck.map(c=>({...c})));
    this.discardPile=[];this.hand=[];this.exhaustPile=[];
    if(this.hasRelic('kunaibag'))this.block+=5;
    if(this.hasRelic('sage_cloak'))this.block+=8;
    if(this.hasRelic('flak_jacket'))this.block+=6;
    if(this.hasRelic('anbu_mask')&&(kind==='elite'||kind==='boss'))this.str+=1;
    if(this.hasRelic('hokage_cloak')){this.str+=1;this.dex+=1}
    $('stage').className='act'+(this.act+1);
    $('combat-log').textContent=kind==='boss'?`${A.bossName}:「让我见识一下你的实力吧……」`:'战斗开始!';
    show('screen-combat');
    this.startTurn();
  },
  playerEl(){return document.querySelector('#player-side .frame')},
  enemyEl(i){return document.querySelector(`[data-ei="${i}"] .frame`)},

  /* ----- 回合 ----- */
  startTurn(){
    this.turn++;this.stats.turns++;
    if(this.turn>1)this.block=0;
    this.energy=3
      +(this.hasRelic('scroll')?1:0)
      +(this.turn===1&&this.hasRelic('hiraishin')?1:0);
    this.firstAtk=true;this.firstSkl=true;
    if(this.turn===1&&this.hasRelic('chakra_bead'))this.str+=1;
    if(this.nindoBlk)this.block+=this.nindoBlk;
    if(this.rampStr)this.str+=this.rampStr;
    if(this.hasRelic('cells'))this.hp=Math.min(this.maxHp,this.hp+1);
    if(this.poison>0){
      this.hp-=this.poison;this.fxText(this.playerEl(),'-'+this.poison);SFX.hurt();
      this.poison--;
      if(this.hp<=0){this.updateTopbar();return this.gameOver()}
    }
    this.draw(5+(this.turn===1&&this.hasRelic('book')?2:0)+(this.hasRelic('forbidden_scroll')?1:0));
    this.enemies.forEach(e=>{if(e.hp>0)this.rollIntent(e)});
    this.banner('第 '+this.turn+' 回合 · 我方行动');SFX.turn();
    $('endturn').classList.remove('enemyturn');
    this.updateTopbar();this.renderCombat();
  },
  rollIntent(e){
    e.tc++;
    if(e.special&&e.tc%e.special.every===0)e.intent=e.special.move;
    else{e.intent=e.moves[e.mi%e.moves.length];e.mi++}
  },
  draw(n){
    for(let i=0;i<n;i++){
      if(this.hand.length>=10)break;
      if(!this.drawPile.length){
        if(!this.discardPile.length)break;
        this.drawPile=shuffle(this.discardPile);this.discardPile=[];
      }
      this.hand.push(this.drawPile.pop());
    }
  },
  banner(txt){
    const b=$('turn-banner');b.textContent=txt;
    b.classList.remove('go');void b.offsetWidth;b.classList.add('go');
  },

  /* ----- 出牌交互 ----- */
  cardTargetsAll(c){
    return !!(c.aoe||c.all||c.weak);
  },
  cardHasEnemyEffect(c){
    return !!(c.dmg||c.vuln||c.tvuln||c.tweak||c.weak);
  },
  cardNeedsTarget(c){
    return this.cardHasEnemyEffect(c)&&!this.cardTargetsAll(c);
  },
  clickCard(i){
    if(this.busy)return;
    const c=this.hand[i];if(!c)return;
    if(c.unplayable){toast('「'+c.n+'」无法打出——这是诅咒');return}
    if(c.c>this.energy){toast('查克拉不足');SFX.blk();return}
    const alive=this.enemies.filter(e=>e.hp>0);
    const needsTarget=this.cardNeedsTarget(c);
    if(this.picked===i){
      if(needsTarget){
        if(alive.length===1)return this.playCardAt(i,alive[0]);
        return toast('点击一个敌人作为目标');
      }
      return this.playCardAt(i,null);
    }
    this.picked=i;SFX.card();
    $('target-hint').classList.toggle('on',needsTarget&&alive.length>1);
    this.renderCombat();
    if(!needsTarget)toast('再次点击该卡打出');
  },
  clickEnemy(i){
    if(this.busy)return;
    const e=this.enemies[i];if(!e||e.hp<=0)return;
    if(this.picked!==null){
      const c=this.hand[this.picked];
      if(c&&this.cardNeedsTarget(c))return this.playCardAt(this.picked,e);
    }
  },
  clickStage(ev){
    if(ev.target.closest('.unit')||ev.target.closest('.card'))return;
    if(this.picked!==null){this.picked=null;$('target-hint').classList.remove('on');this.renderCombat()}
  },
  playCardAt(idx,target){
    const c=this.hand[idx];if(!c||c.c>this.energy)return;
    this.picked=null;$('target-hint').classList.remove('on');
    this.hand.splice(idx,1);
    this.stats.cards++;
    this.execCard(c,target);
    if(this.hp<=0||this.combatEnded)return;
    if(c.t==='pwr'||c.ex)this.exhaustPile.push(c);
    else this.discardPile.push(c);
    if(this.checkWin())return;
    this.updateTopbar();this.renderCombat();
  },
  calc(base,att,def){
    let d=base+(att.str||0);
    if(att.weak>0)d=Math.floor(d*0.75);
    if(def.vuln>0)d=Math.floor(d*1.5);
    return Math.max(0,d);
  },
  combatActive(){
    return $('screen-combat').classList.contains('active')&&this.enemies&&this.hand;
  },
  cardAttackBonus(c){
    if(!this.combatActive()||c.t!=='atk'||!this.firstAtk)return 0;
    return (this.hasRelic('fuuma')?4:0)+(this.hasRelic('kyuubi_seal')?6:0);
  },
  cardDamageText(c){
    const bonus=this.cardAttackBonus(c);
    const me={str:this.str||0,weak:this.weak||0};
    const alive=(this.enemies||[]).filter(e=>e.hp>0);
    const targets=c.aoe?alive:[alive[0]||{vuln:0}];
    const vals=[...new Set((targets.length?targets:[{vuln:0}]).map(t=>this.calc(c.dmg+bonus,me,t)))].sort((a,b)=>a-b);
    return vals.length>1?`${vals[0]}-${vals[vals.length-1]}`:`${vals[0]||0}`;
  },
  cardDesc(c){
    if(!this.combatActive())return c.d;
    if(c.unplayable)return c.d;
    const parts=[];
    if(c.dmg){
      const d=this.cardDamageText(c);
      const dmg=c.hits>1?`<b>${d}</b>×<b>${c.hits}</b>`:`<b>${d}</b>`;
      parts.push(`${c.aoe?'对<b>所有</b>敌人':''}造成 ${dmg} 点伤害`);
    }
    if(c.blk)parts.push(`获得 <b>${Math.max(0,c.blk+(this.dex||0))}</b> 点格挡`);
    if(c.draw)parts.push(`抽 <b>${c.draw}</b> 张牌`);
    if(c.energy)parts.push(`获得 <b>${c.energy}</b> 点查克拉`);
    if(c.heal)parts.push(`回复 <b>${c.heal}</b> 点生命`);
    if(c.cleanse)parts.push('清除自身中毒、虚弱、易伤');
    if(c.str)parts.push(`力量 +<b>${c.str}</b>`);
    if(c.dex)parts.push(`身法 +<b>${c.dex}</b>`);
    if(c.clone)parts.push(`获得 <b>${c.clone}</b> 层影分身`);
    if(c.nindo)parts.push(`每回合开始获得 <b>${c.nindo}</b> 点格挡`);
    if(c.ramp)parts.push(`每回合开始力量 +<b>${c.ramp}</b>`);
    const vBonus=this.hasRelic('sharingan')?1:0;
    const wBonus=this.hasRelic('seal_tag')?1:0;
    const vuln=(c.vuln||0)+(c.tvuln||0);
    const weak=(c.tweak||0)+(c.weak||0);
    const scope=this.cardTargetsAll(c)?'对所有敌人':'对目标';
    if(vuln)parts.push(`${scope}施加 <b>${vuln+vBonus}</b> 层易伤`);
    if(weak)parts.push(`${scope}施加 <b>${weak+wBonus}</b> 层虚弱`);
    if(c.self)parts.push(`自身受 <b>${c.self}</b> 点伤害`);
    if(c.ex)parts.push('<b>消耗</b>');
    return parts.length?parts.join(', '):c.d;
  },
  dealDamage(e,raw,pure=false){
    let d=raw;
    const blocked=pure?0:Math.min(e.block,d);
    if(!pure)e.block-=blocked;
    d-=blocked;
    e.hp-=d;
    this.stats.dmg+=d;
    const el=this.enemyEl(this.enemies.indexOf(e));
    if(el){
      this.fxSlash(el);
      if(blocked&&!d)this.fxText(el,'格挡!','blk');
      else this.fxText(el,'-'+d);
      el.closest('.unit').classList.add('hitfx');
      setTimeout(()=>el.closest('.unit')&&el.closest('.unit').classList.remove('hitfx'),320);
    }
    SFX.atk();
    if(e.hp<=0)this.handleDeath(e);
  },
  handleDeath(e){
    if(e.boss&&e.phase2&&!e.phase2done){
      e.phase2done=true;
      const p=e.phase2;
      e.n=p.n;e.sp=p.sp;e.sprite=p.sprite||e.sprite||"";e.hp=Math.floor(e.maxHp*p.hpRatio);
      e.str+=p.str;e.moves=p.moves;e.special=p.special;e.mi=0;e.tc=0;
      e.regen=p.regen||e.regen||0;e.grow=p.grow||e.grow||null;
      this.rollIntent(e);
      this.banner('禁 术 · 解 放');SFX.lose();
      $('stage').classList.add('shake');setTimeout(()=>$('stage').classList.remove('shake'),400);
      toast('大蛇丸蜕下人皮,化作巨蛇之躯——战斗进入第二阶段!');
      return;
    }
    if(e.hp<=0)this.stats.kills++;
  },
  execCard(c,target){
    this.energy-=c.c;
    let bonus=0;
    if(c.t==='atk'&&this.firstAtk){
      if(this.hasRelic('fuuma'))bonus+=4;
      if(this.hasRelic('kyuubi_seal'))bonus+=6;
      this.firstAtk=false;
    }
    if(c.t==='skl'&&this.firstSkl){
      if(this.hasRelic('bell')){this.block+=3;this.fxText(this.playerEl(),'+3','blk')}
      if(this.hasRelic('chakra_thread'))this.draw(1);
      this.firstSkl=false;
    }
    const me={str:this.str,weak:this.weak};
    const vBonus=this.hasRelic('sharingan')?1:0;
    const wBonus=this.hasRelic('seal_tag')?1:0;
    const targetsAll=this.cardTargetsAll(c);
    if(c.dmg){
      const ts=c.aoe?this.enemies.filter(e=>e.hp>0):[target];
      ts.forEach(t=>{
        if(!t)return;
        for(let h=0;h<c.hits;h++){
          if(t.hp<=0)break;
          this.dealDamage(t,this.calc(c.dmg+bonus,me,t));
        }
        if(c.vuln&&t.hp>0)t.vuln+=c.vuln+vBonus;
      });
    }
    if(c.tvuln){const ts=targetsAll||!target?this.enemies.filter(e=>e.hp>0):[target];ts.forEach(t=>t.vuln+=c.tvuln+vBonus)}
    if(c.tweak||c.weak){
      const w=(c.tweak||0)+(c.weak||0)+wBonus;
      const ts=targetsAll||!target?this.enemies.filter(e=>e.hp>0):[target];
      ts.forEach(t=>t.weak+=w);
    }
    if(c.blk){const b=c.blk+this.dex;this.block+=b;this.fxText(this.playerEl(),'+'+b,'blk');SFX.blk()}
    if(c.draw)this.draw(c.draw);
    if(c.heal){this.heal(c.heal);this.fxText(this.playerEl(),'+'+c.heal,'heal')}
    if(c.self){this.hp-=c.self;this.fxText(this.playerEl(),'-'+c.self);if(this.hp<=0){this.updateTopbar();return this.gameOver()}}
    if(c.cleanse){this.poison=0;this.weak=0;this.vuln=0}
    if(c.energy)this.energy+=c.energy;
    if(c.clone)this.clones+=c.clone;
    if(c.str)this.str+=c.str;
    if(c.dex)this.dex+=c.dex;
    if(c.nindo)this.nindoBlk+=c.nindo;
    if(c.ramp)this.rampStr+=c.ramp;
    $('combat-log').textContent=`使出「${c.n.replace('⁺','')}」!`;
  },
  checkWin(){
    if(this.hp<=0||this.combatEnded)return false;
    if(this.enemies.every(e=>e.hp<=0)){
      this.busy=true;this.combatEnded=true;
      this.renderCombat();
      setTimeout(()=>this.winCombat(),650);
      return true;
    }
    return false;
  },
  applyEnemyStartEffects(e){
    if(!e.regen||e.hp<=0||e.hp>=e.maxHp)return '';
    const h=Math.min(e.regen,e.maxHp-e.hp);
    e.hp+=h;this.fxText(this.enemyEl(this.enemies.indexOf(e)),'+'+h,'heal');
    return `再生 +${h}`;
  },
  applyEnemyGrowth(e){
    const g=e.grow;
    if(!g||!g.every||e.tc%g.every!==0)return '';
    const parts=[];
    if(g.str){e.str+=g.str;parts.push(`力量 +${g.str}`)}
    if(g.b){e.block+=g.b;parts.push(`格挡 +${g.b}`)}
    if(g.heal&&e.hp>0&&e.hp<e.maxHp){
      const h=Math.min(g.heal,e.maxHp-e.hp);
      e.hp+=h;parts.push(`回复 +${h}`);
    }
    if(parts.length)this.fxText(this.enemyEl(this.enemies.indexOf(e)),parts[0],'blk');
    return parts.length?`蓄势: ${parts.join(', ')}`:'';
  },
  endTurn(){
    if(this.busy||this.combatEnded)return;
    this.busy=true;this.picked=null;$('target-hint').classList.remove('on');
    if(this.clones){
      const b=this.clones*3;this.block+=b;
      this.fxText(this.playerEl(),'+'+b,'blk');
      this.clones=Math.max(0,this.clones-1);
      this.fxText(this.playerEl(),'影分身-1','blk');
    }
    this.discardPile.push(...this.hand);this.hand=[];
    if(this.weak)this.weak--;
    if(this.vuln)this.vuln--;
    $('endturn').classList.add('enemyturn');
    this.banner('敌 方 行 动');
    this.renderCombat();
    const acts=this.enemies.filter(e=>e.hp>0);
    let i=0;
    const step=()=>{
      if(this.hp<=0)return this.gameOver();
      if(i>=acts.length){
        this.enemies.forEach(e=>{if(e.weak)e.weak--;if(e.vuln)e.vuln--});
        this.busy=false;
        return this.startTurn();
      }
      const e=acts[i++];
      if(e.hp<=0)return step();
      e.block=0;
      const m=e.intent,ei=this.enemies.indexOf(e);
      const regenText=this.applyEnemyStartEffects(e);
      const uEl=document.querySelector(`[data-ei="${ei}"]`);
      if(uEl)uEl.classList.add('lunge-l');
      setTimeout(()=>{
        if(uEl)uEl.classList.remove('lunge-l');
        if(m){
          if(m.a){
            let total=0;
            for(let h=0;h<(m.hits||1);h++){
              let d=this.calc(m.a,e,{vuln:this.vuln});
              const blocked=Math.min(this.block,d);this.block-=blocked;d-=blocked;
              this.hp-=d;total+=d;
            }
            if(total>0){
              this.fxText(this.playerEl(),'-'+total);SFX.hurt();
              const pu=document.querySelector('#player-side .unit');
              if(pu){pu.classList.add('hitfx');setTimeout(()=>pu.classList.remove('hitfx'),320)}
              if(total>=12){$('stage').classList.add('shake');setTimeout(()=>$('stage').classList.remove('shake'),400)}
            }else{this.fxBlock(this.playerEl());SFX.blk()}
          }
          if(m.b)e.block+=m.b;
          if(m.str)e.str+=m.str;
          if(m.heal)e.hp=Math.min(e.maxHp,e.hp+m.heal);
          if(m.weak)this.weak+=m.weak;
          if(m.vulnP)this.vuln+=m.vulnP;
          if(m.poison)this.poison+=m.poison;
          const growText=this.applyEnemyGrowth(e);
          $('combat-log').textContent=`${e.n} 使出「${m.txt}」${regenText?' · '+regenText:''}${growText?' · '+growText:''}`;
        }
        this.updateTopbar();this.renderCombat();
        setTimeout(step,460);
      },200);
    };
    setTimeout(step,650);
  },

  /* ----- 特效 ----- */
  fxText(anchor,txt,cls=''){
    if(!anchor)return;
    const r=anchor.getBoundingClientRect(),a=$('app').getBoundingClientRect();
    const f=document.createElement('div');
    f.className='fdmg '+cls;f.textContent=txt;
    f.style.left=(r.left-a.left+r.width/2-16+rnd(-14,14))+'px';
    f.style.top=(r.top-a.top+rnd(0,16))+'px';
    $('app').appendChild(f);setTimeout(()=>f.remove(),900);
  },
  fxSlash(anchor){
    if(!anchor)return;
    const r=anchor.getBoundingClientRect(),a=$('app').getBoundingClientRect();
    const f=document.createElement('div');f.className='slashfx';
    f.style.left=(r.left-a.left+r.width/2-45)+'px';
    f.style.top=(r.top-a.top+r.height/2-45)+'px';
    $('app').appendChild(f);setTimeout(()=>f.remove(),420);
  },
  fxBlock(anchor){
    if(!anchor)return;
    const r=anchor.getBoundingClientRect(),a=$('app').getBoundingClientRect();
    const f=document.createElement('div');f.className='blockfx';f.textContent='🛡️';
    f.style.left=(r.left-a.left+r.width/2-17)+'px';
    f.style.top=(r.top-a.top+r.height/2-22)+'px';
    $('app').appendChild(f);setTimeout(()=>f.remove(),560);
  },

  /* ----- 渲染 ----- */
  intentHTML(e){
    const m=e.intent;if(!m)return '…';
    let p=[];
    if(m.a){
      const d=this.calc(m.a,e,{vuln:this.vuln});
      p.push(`⚔️<b>${d}${(m.hits||1)>1?'×'+m.hits:''}</b>`);
    }
    if(m.b)p.push(`<span class="ib">🛡️${m.b}</span>`);
    if(m.str)p.push('💪');
    if(m.heal)p.push('💚');
    if(m.weak)p.push('🌀');
    if(m.vulnP)p.push('💢');
    if(m.poison)p.push('☠️');
    return p.join(' ');
  },
  stTags(o,isPlayer){
    const T=[];
    const add=(name,val,buff)=>T.push(`<span class="stag ${buff?'buff':'debuff'}" onclick="event.stopPropagation();toast('<b>${name}</b>:${esc(KW[name]||'')}')">${name}${val}</span>`);
    if(o.str)add('力量',o.str,o.str>0);
    if(o.weak)add('虚弱',o.weak,false);
    if(o.vuln)add('易伤',o.vuln,false);
    if(o.regen)add('再生',o.regen,true);
    if(o.grow)add('蓄势','',true);
    if(isPlayer){
      if(this.dex)add('身法',this.dex,true);
      if(this.clones)add('影分身',this.clones,true);
      if(this.nindoBlk)add('忍道',this.nindoBlk,true);
      if(this.rampStr)add('九尾',this.rampStr,true);
      if(this.poison)add('中毒',this.poison,false);
    }
    return T.join('');
  },
  renderCombat(){
    const C=this.char();
    // 玩家
    $('player-side').innerHTML=`<div class="unit player" onclick="G.clickStage(event)">
      ${unitFrame(C.face,C.sprite,C.n)}
      <div class="uname">${C.n} ${this.block?`<span class="ub">🛡️${this.block}</span>`:''}</div>
      <div class="hpbar pb"><i style="width:${Math.max(0,this.hp/this.maxHp*100)}%"></i></div>
      <div class="hptx">${Math.max(0,this.hp)} / ${this.maxHp}</div>
      <div class="strow">${this.stTags({str:this.str,weak:this.weak,vuln:this.vuln},true)}</div>
    </div>`;
    // 敌人
    $('enemy-side').innerHTML=this.enemies.map((e,i)=>{
      const dead=e.hp<=0;
      const pickedTarget=this.picked!==null&&this.hand[this.picked]&&this.cardNeedsTarget(this.hand[this.picked]);
      return `<div class="unit ${dead?'dead':''} ${e.elite?'elite':''} ${e.boss?'boss':''} ${!dead?'targetable':''} ${pickedTarget&&!dead?'target-glow':''}" data-ei="${i}" onclick="G.clickEnemy(${i})">
        <div class="intent">${dead?'':this.intentHTML(e)+' <span style="opacity:.65;font-size:11px">'+(e.intent?e.intent.txt:'')+'</span>'}</div>
        ${unitFrame(e.sp,e.sprite,e.n)}
        <div class="uname">${e.n} ${e.block?`<span class="ub">🛡️${e.block}</span>`:''}</div>
        <div class="hpbar"><i style="width:${Math.max(0,e.hp/e.maxHp*100)}%"></i></div>
        <div class="hptx">${Math.max(0,e.hp)} / ${e.maxHp}</div>
        <div class="strow">${this.stTags(e)}</div>
      </div>`;
    }).join('');
    // 手牌(扇形)
    const hand=$('hand');
    const W=hand.clientWidth||300;
    const n=this.hand.length;
    const cardW=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w'))||126;
    const gap=n>1?Math.min(cardW*0.82,(W-cardW-10)/(n-1)):0;
    const startX=(W-(cardW+gap*(n-1)))/2;
    hand.innerHTML=this.hand.map((c,i)=>{
      const mid=(n-1)/2;
      const rot=n>1?(i-mid)*Math.min(4.5,26/n):0;
      const ty=Math.abs(i-mid)*Math.min(3.5,16/n);
      const cls=['inhand'];
      if(c.c>this.energy&&!c.unplayable)cls.push('noafford');
      if(c.unplayable)cls.push('noafford');
      if(this.picked===i)cls.push('picked');
      const st=`left:${startX+i*gap}px;bottom:16px;transform:rotate(${rot}deg) translateY(${ty}px);z-index:${10+i}`;
      return `<div onclick="event.stopPropagation();G.clickCard(${i})" style="display:contents">${cardHTML(c,cls.join(' '),st)}</div>`;
    }).join('');
    // 信息
    $('n-energy').textContent=this.energy;
    $('orb').classList.toggle('zero',this.energy===0);
    $('n-draw').textContent=this.drawPile.length;
    $('n-discard').textContent=this.discardPile.length;
  },
});
window.addEventListener('resize',()=>{if($('screen-combat').classList.contains('active')&&G.hand)G.renderCombat()});
document.addEventListener('click',e=>{
  if(!$('screen-combat').classList.contains('active'))return;
  if(e.target.closest('#stage')&&!e.target.closest('.unit'))G.clickStage(e);
});
</script>
<script>
/* ====================== 奖励 / 篝火 / 商店 / 事件 / 结算 ====================== */
Object.assign(G,{
  winCombat(){
    const kind=this.combatKind;
    if(this.hasRelic('ramen'))this.heal(3);
    if(this.hasRelic('slug_charm')&&this.hp<this.maxHp/2)this.heal(5);
    if(kind==='elite')this.stats.elites++;
    SFX.win();
    this._pendingPotion=null;this._cardPicked=false;
    if(kind==='boss')return this.bossReward();
    let gold=kind==='elite'?rnd(50,70):rnd(20,34);
    let goldMul=1;
    if(this.hasRelic('dice'))goldMul+=0.4;
    if(this.hasRelic('mission_pass'))goldMul+=0.2;
    gold=Math.floor(gold*goldMul);
    this.gold+=gold;SFX.gold();this.updateTopbar();
    let html=`<div class="ritem noclick">🪙 缴获 ${gold} 金币</div>`;
    if(kind==='elite'){
      const r=this.randomRelic();
      if(r){this.addRelic(r);html+=`<div class="ritem noclick">${RELICS[r].ic} 获得忍具「${RELICS[r].n}」<br><span style="color:var(--paper-dim);font-size:12.5px">${RELICS[r].d}</span></div>`}
    }
    if(Math.random()<(kind==='elite'?MAP_RULES.potionDrop.elite:MAP_RULES.potionDrop.fight)){
      const pk=this.randomPotionKey();
      this._pendingPotion=pk;
      html+=`<div class="ritem" id="potion-take" onclick="G.takePotion()">${POTIONS[pk].ic} 拾取秘药「${POTIONS[pk].n}」— ${POTIONS[pk].d}</div>`;
    }
    html+=`<div class="sec-s" style="margin-top:10px">领悟新忍术 — 选择一张加入卡组(可跳过)</div>`;
    const cs=this.combatRewardCards(kind);
    this._choices=cs;this._cardPicked=false;
    html+=`<div class="cgrid" id="card-reward-grid">${cs.map((c,i)=>`<div style="position:relative;width:var(--card-w);height:var(--card-h)" onclick="G.takeCard(${i})">${cardHTML(c,'static')}</div>`).join('')}</div>
      <div class="sec-s" id="card-reward-status"></div>`;
    html+=`<button class="btn ghost" onclick="G.backToMap()">跳过,继续前进</button>`;
    $('reward-list').innerHTML=html;
    show('screen-reward');
  },
  takePotion(){
    if(this._pendingPotion&&this.addPotion(this._pendingPotion)){
      SFX.potion();toast(`收下「${POTIONS[this._pendingPotion].n}」`);
      const el=$('potion-take');if(el){el.classList.add('noclick');el.style.opacity=.4}
      this._pendingPotion=null;
      if(this._cardPicked)this.backToMap();
    }
  },
  takeCard(i){
    if(this._cardPicked)return toast('只能领悟一张');
    const c=this._choices[i];if(!c)return;
    this.deck.push(c);this._cardPicked=true;this._choices=[];
    SFX.card();toast(`「${c.n}」加入卡组`);
    const grid=$('card-reward-grid');
    if(grid){grid.classList.add('sold');grid.style.pointerEvents='none'}
    const status=$('card-reward-status');
    if(status)status.textContent=this._pendingPotion?'已选择卡牌,还可以拾取秘药':'已选择卡牌';
    if(!this._pendingPotion)this.backToMap();
  },
  bossReward(){
    const isFinal=this.act>=ACTS.length-1;
    if(isFinal)return this.victory();
    const A=ACTS[this.act],next=ACTS[this.act+1];
    const gold=rnd(90,110);this.gold+=gold;
    const healAmt=Math.floor(this.maxHp*0.4);this.heal(healAmt);
    const bossRelics=this.randomBossRelics(1);
    bossRelics.forEach(k=>this.addRelic(k));
    this.updateTopbar();
    const relicHtml=bossRelics.length
      ? bossRelics.map(k=>`<div class="ritem noclick">${BOSS_RELICS[k].ic} 获得首领忍具「${BOSS_RELICS[k].n}」<br><span style="color:var(--paper-dim);font-size:12.5px">${BOSS_RELICS[k].d}</span></div>`).join('')
      : '<div class="ritem noclick">🪙 首领忍具已经收集齐全,额外缴获 120 金币</div>';
    if(!bossRelics.length){this.gold+=120;this.updateTopbar()}
    let html=`<div class="sec-s" style="font-size:14px">${A.clearText||`${A.bossName}败退,通往${next.name}的路出现了。`}</div>
      <div class="ritem noclick">🪙 缴获 ${gold} 金币 · 💚 休整回复 ${healAmt} 点生命</div>
      <div class="sec-s" style="margin-top:12px;color:var(--gold)">◆ 首领战利品 ◆</div>
      ${relicHtml}
      <div class="sec-s" style="margin-top:10px">领悟一张稀有忍术 — 可跳过</div>`;
    const cs=this.randomCards(3,2).map(c=>this.maybeUpgradeRewardCard(c,this.rewardUpgradeChance('boss')));
    this._choices=cs;this._cardPicked=false;
    html+=`<div class="cgrid">${cs.map((c,i)=>`<div style="position:relative;width:var(--card-w);height:var(--card-h)" onclick="G.takeBossCard(${i})">${cardHTML(c,'static')}</div>`).join('')}</div>
      <button class="btn" onclick="G.toNextAct()">进入${next.name.split(' · ')[0]} →</button>`;
    $('reward-list').innerHTML=html;
    show('screen-reward');
  },
  takeBossCard(i){
    if(this._cardPicked)return toast('只能领悟一张');
    const c=this._choices[i];if(!c)return;
    this._cardPicked=true;this.deck.push(c);SFX.card();
    toast(`「${c.n}」加入卡组`);
  },
  toNextAct(){
    this.startAct(this.act+1);
  },

  /* ---------- 宝箱 ---------- */
  openChest(){
    const r=this.randomRelic();
    let body;
    if(r){
      this.addRelic(r);SFX.gold();
      body=`<div class="ritem noclick">${RELICS[r].ic} 获得忍具「${RELICS[r].n}」<br><span style="color:var(--paper-dim);font-size:12.5px">${RELICS[r].d}</span></div>`;
    }else{
      this.gold+=85;SFX.gold();this.updateTopbar();
      body='<div class="ritem noclick">🪙 忍具已经收集齐全,你找到了 85 金币</div>';
    }
    $('event-box').innerHTML=`<div class="eic">🎁</div>
      <div class="sec-t" style="font-size:19px;letter-spacing:.18em">补给宝箱</div>
      <p>封印锁应声打开,里面是一份为下一段路准备的补给。</p>
      ${body}<button class="btn" onclick="G.backToMap()">继续前进</button>`;
    show('screen-event');
  },

  /* ---------- 篝火 ---------- */
  openRest(){
    const pct=this.hasRelic('medkit')?0.5:0.3;
    const amt=Math.floor(this.maxHp*pct);
    $('screen-rest').innerHTML=`
      <div class="sec-t">🔥 篝 火</div>
      <div class="sec-s">队伍在树影间短暂休整,火光摇曳</div>
      <div class="divider"></div>
      <div class="center">
        <div class="ritem" onclick="G.restHeal(${amt})">🍙 打坐调息<br><span style="color:var(--paper-dim);font-size:12.5px">回复 ${amt} 点生命(${Math.round(pct*100)}%)</span></div>
        <div class="ritem" onclick="G.restUpgrade()">📜 修炼忍术<br><span style="color:var(--paper-dim);font-size:12.5px">永久升级一张卡牌</span></div>
      </div>`;
    show('screen-rest');
  },
  restHeal(amt){this.heal(amt);toast(`回复了 ${amt} 点生命`);this.backToMap()},
  restUpgrade(){
    this.pickFromDeck('选择要升级的忍术',c=>!c.upgraded&&c.t!=='curse',(c)=>{
      this.confirmRestUpgrade(c);
    });
  },
  confirmRestUpgrade(c){
    this._upgradeCard=c;
    $('overlay').innerHTML=`<div class="center">
      <div class="sec-t" style="font-size:19px">确认修炼</div><div class="divider"></div>
      <div class="cgrid">
        <div><div class="sec-s">当前</div><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(c,'static')}</div></div>
        <div><div class="sec-s">升级后</div><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(mkCard(c.key,true),'static')}</div></div>
      </div>
      <button class="btn" onclick="G.applyRestUpgrade()">确认升级</button>
      <button class="btn ghost small" onclick="G.closeOverlay()">重新选择</button>
    </div>`;
    $('overlay').classList.add('on');
  },
  applyRestUpgrade(){
    const c=this._upgradeCard;
    if(!c||c.upgraded)return this.closeOverlay();
    upgradeCard(c);this._upgradeCard=null;this.closeOverlay();
    SFX.heal();toast(`「${c.n}」修炼成功!`);this.backToMap();
  },

  /* ---------- 商店 ---------- */
  openShop(){
    this.shopCards=this.randomCards(2,1);
    this.shopCards.push(this.randomCard(2,this.shopCards.map(c=>c.key)));
    this.shopPrices=this.shopCards.map(c=>c.r>=3?165:(c.r===2?110:60));
    this.shopRelics=this.randomRelics(MAP_RULES.shopRelicSlots);
    this.shopPotion=this.randomPotionKey();
    this.removeUsed=false;
    this.renderShop();show('screen-shop');
  },
  renderShop(){
    const aff=p=>this.gold>=p?'':'cant';
    let h=`<div class="sec-t">🏪 行商的帐篷</div>
      <div class="sec-s">「呵呵,小兄弟,木叶的货可不便宜……看看?」 · 你的金币:<b style="color:var(--gold)">${this.gold}</b></div>
      <div class="divider"></div>
      <div class="cgrid">`;
    h+=this.shopCards.map((c,i)=>{
      if(!c)return `<div style="width:var(--card-w);text-align:center;color:var(--paper-dim);padding-top:60px">已售出</div>`;
      return `<div onclick="G.buyCard(${i})"><div style="position:relative;width:var(--card-w);height:var(--card-h)">${cardHTML(c,'static')}</div>
        <div class="price ${aff(this.shopPrices[i])}">🪙 ${this.shopPrices[i]}</div></div>`;
    }).join('');
    h+=`</div><div class="cgrid">`;
    if(this.shopRelics.length){
      h+=this.shopRelics.map((k,i)=>{
        if(!k)return `<div class="shop-relic sold"><div class="ric">✓</div><div class="rname">已售出</div><div class="rdesc">这件忍具已经收入囊中</div></div>`;
        const r=RELICS[k];
        return `<div class="shop-relic" onclick="G.buyRelic(${i})"><div class="ric">${r.ic}</div><div class="rname">${r.n}</div><div class="rdesc">${r.d}</div><div class="price ${aff(150)}">🪙 150</div></div>`;
      }).join('');
    }
    if(this.shopPotion){const p=POTIONS[this.shopPotion];
      h+=`<div class="shop-relic" onclick="G.buyPotion()" style="border-color:var(--chakra)"><div class="ric">${p.ic}</div><div class="rname" style="color:var(--chakra)">${p.n}</div><div class="rdesc">${p.d}</div><div class="price ${aff(45)}">🪙 45</div></div>`}
    h+=`<div class="shop-relic ${this.removeUsed?'sold':''}" onclick="G.buyRemove()"><div class="ric">🗑️</div><div class="rname">删卡服务</div><div class="rdesc">从卡组中永久移除一张卡牌</div><div class="price ${aff(75)}">🪙 75</div></div>`;
    h+=`</div><div class="center" style="margin-top:18px"><button class="btn ghost" onclick="G.backToMap()">离开商店</button></div>`;
    $('screen-shop').innerHTML=h;
  },
  buyCard(i){
    const c=this.shopCards[i];if(!c)return;
    if(this.gold<this.shopPrices[i])return toast('金币不足');
    this.gold-=this.shopPrices[i];this.deck.push(c);this.shopCards[i]=null;
    SFX.gold();toast(`购入「${c.n}」`);this.updateTopbar();this.renderShop();
  },
  buyRelic(i){
    if(!this.shopRelics||!this.shopRelics[i])return;
    if(this.gold<150)return toast('金币不足');
    this.gold-=150;const r=this.shopRelics[i];this.shopRelics[i]=null;
    this.addRelic(r);SFX.gold();toast(`获得「${RELICS[r].n}」`);this.renderShop();
  },
  buyPotion(){
    if(!this.shopPotion)return;
    if(this.gold<45)return toast('金币不足');
    if(!this.addPotion(this.shopPotion))return;
    this.gold-=45;this.shopPotion=null;
    SFX.gold();this.updateTopbar();this.renderShop();
  },
  buyRemove(){
    if(this.removeUsed)return;
    if(this.gold<75)return toast('金币不足');
    this.pickFromDeck('选择要移除的卡牌',()=>true,(c,idx)=>{
      this.gold-=75;this.removeUsed=true;this.deck.splice(idx,1);
      SFX.card();toast(`移除了「${c.n}」`);this.updateTopbar();this.renderShop();show('screen-shop');
    });
  },

  /* ---------- 奇遇 ---------- */
  openEvent(){
    const ev=pick(EVENTS);this._event=ev;
    $('event-box').innerHTML=`<div class="eic">${ev.ic}</div>
      <div class="sec-t" style="font-size:19px;letter-spacing:.18em">${ev.title}</div>
      <p>${ev.text}</p>
      <div class="eopts">${ev.opts.map((o,i)=>{
        const ok=!o.cond||o.cond(this);
        return `<button class="btn ghost" ${ok?'':'disabled'} onclick="G.eventChoice(${i})">${o.t}</button>`}).join('')}</div>`;
    show('screen-event');
  },
  eventChoice(i){
    const r=this._event.opts[i].f(this);
    this.updateTopbar();
    if(this.hp<=0)return;
    if(this.pendingRemove){
      this.pendingRemove=false;
      return this.pickFromDeck('选择要移除的卡牌',()=>true,(c,idx)=>{
        this.deck.splice(idx,1);toast(`移除了「${c.n}」`);this.backToMap();
      },false,()=>this.backToMap());
    }
    $('event-box').innerHTML=`<div class="eic">${this._event.ic}</div>
      <p>${r}</p><button class="btn" onclick="G.backToMap()">继续前进</button>`;
  },

  /* ---------- 结算 ---------- */
  statHTML(){
    return `<div class="statline">
      <span>总伤害 <b>${this.stats.dmg}</b></span><span>击败敌人 <b>${this.stats.kills}</b></span>
      <span>出牌 <b>${this.stats.cards}</b></span><span>历经回合 <b>${this.stats.turns}</b></span>
      <span>精英战 <b>${this.stats.elites}</b></span><span>卡组 <b>${this.deck.length}</b> 张</span>
      <span>忍具 <b>${this.relics.length}</b> 件</span></div>`;
  },
  gameOver(){
    if(this._ended)return;this._ended=true;
    this.combatEnded=true;this.busy=true;
    setTimeout(()=>this._ended=false,500);
    this.hp=0;this.updateTopbar();SFX.lose();
    $('end-content').innerHTML=`
      <div style="font-size:60px">⚰️</div>
      <div class="title-main" style="font-size:40px;color:#e05a5a;background:none;-webkit-background-clip:unset;filter:none">任 务 失 败</div>
      <p style="color:var(--paper-dim);text-align:center;line-height:2">你倒在了 ${ACTS[this.act].name} · 第 ${this.row} 层。<br>但忍者的意志不会就此熄灭。</p>
      ${this.statHTML()}
      <button class="btn" style="margin-top:14px" onclick="G.newRun()">卷土重来</button>`;
    show('screen-end');
  },
  victory(){
    SFX.win();this.updateTopbar();
    $('end-content').innerHTML=`
      <div class="uzu-wrap" style="margin:0 auto"><div class="uzu"></div><div class="uzu u2"></div><div class="uzu-core">🍥</div></div>
      <div class="title-main" style="font-size:40px">任 务 完 成</div>
      <p style="text-align:center;line-height:2.1;font-size:14.5px">须佐能乎的光芒在黎明前消散,黑底红云退入远方。<br>
      你带着情报回到木叶,新的道路仍在脚下延伸。<br>
      <b style="color:var(--naruto);font-size:17px">「这就是——我的忍道!」</b></p>
      ${this.statHTML()}
      <button class="btn" style="margin-top:14px" onclick="G.newRun()">开启新的轮回</button>`;
    show('screen-end');
  },
});
window.G=G;window.CHARACTERS=CHARACTERS;window.CARDS=CARDS;window.RELICS=RELICS;window.BOSS_RELICS=BOSS_RELICS;window.POTIONS=POTIONS;window.ENEMIES=ENEMIES;window.ACTS=ACTS;window.MAP_RULES=MAP_RULES;window.mkCard=mkCard;window.upgradeCard=upgradeCard;
</script>
</body>
</html>
